<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stylus Avatar Studio</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --accent: #ff4a6b;
            --text: #ffffff;
        }
        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 280px;
            background: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        h1 { font-size: 1.5rem; margin: 0; color: var(--accent); }
        h2 { font-size: 1.1rem; margin: 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .btn {
            background: #2a2e38;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-align: center;
        }
        .btn:hover { background: #353a45; }
        .btn.recording { background: var(--accent); border-color: var(--accent); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #stage-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }
        #viewport-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * 9 / 16);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        /* Startup Overlay */
        #startup-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        .status { font-size: 0.8rem; color: #888; text-align: center; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <h1>Avatar Studio</h1>
            <p style="font-size: 0.8rem; color: #aaa; margin: 5px 0 0 0;">Stylus-driven 3D IK & Lip-Sync</p>
        </div>

        <div>
            <h2>Session Status</h2>
            <div id="cam-status" class="status">Camera: Off</div>
            <div id="mic-status" class="status">Mic: Off</div>
            <div id="model-status" class="status">Avatar: Loading...</div>
        </div>

        <div>
            <h2>Video Export (9:16)</h2>
            <button id="record-btn" class="btn" disabled>Start Recording</button>
            <div id="rec-status" class="status">Status: Idle</div>
        </div>

        <div>
            <h2>Canvas Tools</h2>
            <button id="clear-btn" class="btn">Clear Drawing</button>
        </div>
        
        <div style="margin-top: auto; font-size: 0.7rem; color: #555;">
            Libraries: Three.js, @pixiv/three-vrm, Perfect-Freehand, RecordRTC
        </div>
    </div>

    <div id="stage-container">
        <div id="viewport-wrapper">
            <!-- Single unified WebGL Canvas -->
            <canvas id="three-canvas"></canvas>
            
            <!-- Startup Permissions Overlay -->
            <div id="startup-overlay">
                <h2>Welcome to Avatar Studio</h2>
                <p>To begin, please enable your Camera and Microphone.</p>
                <button id="start-session-btn" class="btn" style="background: var(--accent); border-color: var(--accent);">Enable Camera & Mic</button>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>
    
    <!-- Correct Import Map for Three.js -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/+esm';
        import { getStroke } from 'https://cdn.jsdelivr.net/npm/perfect-freehand@1.2.2/+esm';

        // --- DOM Elements ---
        const threeCanvas = document.getElementById('three-canvas');
        const micBtn = document.getElementById('mic-btn');
        const recordBtn = document.getElementById('record-btn');
        const clearBtn = document.getElementById('clear-btn');
        const wrapper = document.getElementById('viewport-wrapper');
        const startSessionBtn = document.getElementById('start-session-btn');
        const startupOverlay = document.getElementById('startup-overlay');

        // --- State Variables ---
        let vrm = null;
        let currentStroke = [];
        let allStrokes = [];
        let isDrawing = false;
        let audioContext, analyser, micStream, videoStream, recRecorder;
        let isRecording = false;
        let videoTexture, drawTexture;
        let modelLoaded = false;

        // Hidden canvas for 2D drawing (will be used as a texture in 3D)
        const drawCanvas = document.createElement('canvas');
        drawCanvas.width = 1080;
        drawCanvas.height = 1920;
        const drawCtx = drawCanvas.getContext('2d');
        drawCtx.fillStyle = '#ffffff';
        drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, 9/16, 0.1, 100);
        camera.position.set(0, 1.35, 2.5);
        camera.lookAt(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.autoClear = false; // We will manually clear to composite layers

        // Lighting for MToon Shader
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(1, 1.5, 1).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // --- 2D Drawing Texture Plane ---
        // This plane floats in front of the camera and displays the 2D drawing
        const drawMaterial = new THREE.MeshBasicMaterial({ map: null, transparent: true, opacity: 0.6 });
        drawTexture = new THREE.CanvasTexture(drawCanvas);
        drawTexture.minFilter = THREE.LinearFilter;
        drawMaterial.map = drawTexture;
        
        const drawPlaneGeometry = new THREE.PlaneGeometry(1.8, 3.2); // Matches 9:16 aspect
        const drawPlane = new THREE.Mesh(drawPlaneGeometry, drawMaterial);
        drawPlane.position.z = -0.5; // Slightly in front of avatar
        camera.add(drawPlane);
        scene.add(camera); // Add camera to scene so the plane renders relative to view

        // --- VRM Avatar Loading ---
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        
        loader.load(
            'https://cdn.jsdelivr.net/gh/pixiv/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm',
            (gltf) => {
                vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.combineSkeletons(vrm.scene);
                scene.add(vrm.scene);
                vrm.humanoid.resetNormalizedPose();
                
                modelLoaded = true;
                document.getElementById('model-status').innerText = "Avatar: Ready";
                checkReadyState();
            },
            (progress) => console.log('Loading model...', progress),
            (error) => console.error('Error loading VRM:', error)
        );

        // --- Resize Logic ---
        function resizeCanvases() {
            const rect = wrapper.getBoundingClientRect();
            renderer.setSize(rect.width, rect.height, false);
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // --- Drawing Input ---
        function getPointerCoords(e) {
            const rect = threeCanvas.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * drawCanvas.width;
            const y = ((e.clientY - rect.top) / rect.height) * drawCanvas.height;
            return { x, y };
        }

        threeCanvas.addEventListener('pointerdown', (e) => {
            if (startupOverlay.classList.contains('hidden') === false) return;
            isDrawing = true;
            const { x, y } = getPointerCoords(e);
            currentStroke = [{ x, y, pressure: e.pressure > 0 ? e.pressure : 0.5 }];
            updateArmIK(e);
        });

        threeCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const { x, y } = getPointerCoords(e);
            currentStroke.push({ x, y, pressure: e.pressure > 0 ? e.pressure : 0.5 });
            renderStrokes();
            updateArmIK(e);
        });

        threeCanvas.addEventListener('pointerup', () => {
            if (isDrawing && currentStroke.length > 0) allStrokes.push(currentStroke);
            isDrawing = false;
            currentStroke = [];
        });

        function renderStrokes() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            
            const renderStroke = (stroke) => {
                const outline = getStroke(stroke, {
                    size: 20,
                    thinning: 0.8,
                    smoothing: 0.5,
                    streamline: 0.5
                });
                if (outline.length === 0) return;
                drawCtx.beginPath();
                drawCtx.moveTo(outline[0][0], outline[0][1]);
                for (let i = 1; i < outline.length; i++) {
                    drawCtx.lineTo(outline[i][0], outline[i][1]);
                }
                drawCtx.closePath();
                drawCtx.fillStyle = '#ff4a6b';
                drawCtx.fill();
            };

            allStrokes.forEach(renderStroke);
            if (isDrawing) renderStroke(currentStroke);
            drawTexture.needsUpdate = true; // Push 2D updates to 3D plane
        }

        // --- Kinematic IK Engine ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const targetWorldPos = new THREE.Vector3();
        const drawingPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.5);

        function updateArmIK(e) {
            const rect = threeCanvas.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(drawingPlane, targetWorldPos)) {
                // Target acquired
            }
        }

        // --- Simple IK Bone Alignment ---
        const _v3a = new THREE.Vector3();
        const _v3b = new THREE.Vector3();
        const _q = new THREE.Quaternion();
        const _parentQ = new THREE.Quaternion();

        function pointBoneAt(bone, target) {
            if (!bone) return;
            const bonePos = bone.getWorldPosition(new THREE.Vector3());
            _v3a.subVectors(target, bonePos).normalize();
            _v3b.set(0, 1, 0);
            _q.setFromUnitVectors(_v3b, _v3a);
            if (bone.parent) {
                bone.parent.getWorldQuaternion(_parentQ).invert();
                _q.premultiply(_parentQ);
            }
            bone.quaternion.slerp(_q, 0.15);
        }

        // --- Startup Permissions Logic ---
        let micReady = false;
        let camReady = false;

        function checkReadyState() {
            if (micReady && camReady && modelLoaded) {
                recordBtn.disabled = false;
            }
        }

        startSessionBtn.addEventListener('click', async () => {
            try {
                // Request both at the same time
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                // Setup Camera Background
                const video = document.createElement('video');
                video.srcObject = videoStream;
                video.muted = true;
                video.play();
                videoTexture = new THREE.VideoTexture(video);
                scene.background = videoTexture; // Set as 3D background

                // Setup Microphone Audio
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(videoStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                
                camReady = true;
                micReady = true;
                document.getElementById('cam-status').innerText = "Camera: Active";
                document.getElementById('mic-status').innerText = "Mic: Active";
                
                startupOverlay.classList.add('hidden');
                checkReadyState();
            } catch (err) {
                alert("Permissions denied. Please allow Camera and Mic to use this app.");
            }
        });

        // --- Vertical Clip Exporter ---
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerText = "Stop Recording";
                document.getElementById('rec-status').innerText = "Status: Recording 9:16...";

                const stream = threeCanvas.captureStream(60);
                recRecorder = RecordRTC(stream, {
                    type: 'video',
                    mimeType: 'video/webm;codecs=vp9',
                    videoBitsPerSecond: 8000000
                });
                recRecorder.startRecording();
            } else {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerText = "Start Recording";
                document.getElementById('rec-status').innerText = "Status: Processing...";

                recRecorder.stopRecording(() => {
                    const blob = recRecorder.getBlob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'avatar-clip.webm';
                    a.click();
                    document.getElementById('rec-status').innerText = "Status: Saved!";
                });
            }
        });

        clearBtn.addEventListener('click', () => {
            allStrokes = [];
            currentStroke = [];
            renderStrokes();
        });

        // --- Animation Loop ---
        let previousVolume = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            renderer.clear();
            renderer.render(scene, camera);
            
            if (!vrm) return;

            // Audio Lip-Sync
            if (analyser) {
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                let avg = sum / dataArray.length / 100;
                avg = Math.min(avg, 1.0);
                previousVolume = previousVolume * 0.8 + avg * 0.2;
                vrm.expressionManager.setValue('aa', previousVolume);
            }

            // Arm IK
            const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
            const rightLowerArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
            const rightHand = vrm.humanoid.getNormalizedBoneNode('rightHand');

            if (rightUpperArm) pointBoneAt(rightUpperArm, targetWorldPos);
            if (rightLowerArm) pointBoneAt(rightLowerArm, targetWorldPos);
            if (rightHand) pointBoneAt(rightHand, targetWorldPos);

            vrm.update(1/60);
        }
        animate();

    </script>
</body>
</html>
