<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Hand Manipulator</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 0; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #ui-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px;
            text-align: center; z-index: 10; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }
        #status { font-size: 14px; font-weight: bold; color: #4a9eff; }
        #gesture { font-size: 12px; color: #aaa; margin-top: 5px; }

        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; color: white; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #333; border-top: 4px solid #4a9eff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div>Initializing Camera & MediaPipe...</div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>

    <div id="ui-overlay">
        <div id="status">SHOW HAND TO START</div>
        <div id="gesture">PALM: CHANGE SHAPE | PINCH: ROTATE & SCALE</div>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>

    <!-- Three.js -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const video = document.getElementById('video');
        const threeCanvas = document.getElementById('three-canvas');
        const loader = document.getElementById('loader');
        const statusDiv = document.getElementById('status');
        const gestureDiv = document.getElementById('gesture');

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 2, 3);
        scene.add(dirLight);

        // Primitives
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0xff4a6b, roughness: 0.4, metalness: 0.3 }),
            new THREE.MeshStandardMaterial({ color: 0x4a9eff, roughness: 0.4, metalness: 0.3 }),
            new THREE.MeshStandardMaterial({ color: 0xffdd00, roughness: 0.4, metalness: 0.3 }),
            new THREE.MeshStandardMaterial({ color: 0x00ffaa, roughness: 0.4, metalness: 0.3 })
        ];
        const geometries = [
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.ConeGeometry(0.7, 1.5, 32),
            new THREE.SphereGeometry(0.8, 32, 32),
            new THREE.TorusGeometry(0.7, 0.3, 16, 100)
        ];
        
        let activeMesh = new THREE.Mesh(geometries[0], materials[0]);
        scene.add(activeMesh);

        // --- Hand Tracking Logic ---
        let hands;
        let palmHoldStart = 0;
        let currentShapeIndex = 0;

        function initHands() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.5
            });
            hands.onResults(onResults);

            // Start camera feed
            const cameraUtil = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); },
                width: 640,
                height: 480
            });
            cameraUtil.start().then(() => { loader.style.display = 'none'; });
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                
                const thumbTip = lm[4];
                const indexTip = lm[8];
                const indexMcp = lm[5];
                const pinkyMcp = lm[17];
                const wrist = lm[0];
                const middleMcp = lm[9];

                // Calculate pinch distance (normalized screen coords)
                const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                const isPinching = pinchDist < 0.05;

                // Check for Open Palm
                const isPalm = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y && lm[20].y < lm[18].y;

                if (isPinching) {
                    palmHoldStart = 0; // Cancel palm hold
                    statusDiv.innerText = "STATUS: PINCHING";
                    gestureDiv.innerText = "ROTATING & SCALING";

                    // 1. Rotation: Map wrist angle to mesh Y rotation
                    // Vector from wrist(0) to middle knuckle(9)
                    const angle = Math.atan2(middleMcp.y - wrist.y, middleMcp.x - wrist.x);
                    // Adjust angle because video is mirrored, and normalize it
                    activeMesh.rotation.y = -angle * 2.5; 

                    // 2. Scale: Map hand size (depth proxy) to mesh scale
                    const handSize = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y);
                    const targetScale = handSize * 10;
                    activeMesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);

                } else if (isPalm) {
                    statusDiv.innerText = "STATUS: OPEN PALM";
                    gestureDiv.innerText = "HOLD TO CHANGE SHAPE...";

                    if (palmHoldStart === 0) palmHoldStart = Date.now();
                    const holdTime = (Date.now() - palmHoldStart) / 1000;

                    if (holdTime > 1.5) {
                        // Cycle shape
                        scene.remove(activeMesh);
                        currentShapeIndex = (currentShapeIndex + 1) % geometries.length;
                        activeMesh = new THREE.Mesh(geometries[currentShapeIndex], materials[currentShapeIndex]);
                        // Reset transform to default
                        activeMesh.position.set(0, 0, 0);
                        activeMesh.scale.set(1, 1, 1);
                        activeMesh.rotation.set(0, 0, 0);
                        scene.add(activeMesh);
                        palmHoldStart = 0; // Reset hold
                        statusDiv.innerText = "STATUS: SHAPE CHANGED!";
                    }
                } else {
                    palmHoldStart = 0;
                    statusDiv.innerText = "STATUS: TRACKING";
                    gestureDiv.innerText = "PALM: SHAPE | PINCH: ROTATE/SCALE";
                }

            } else {
                palmHoldStart = 0;
                statusDiv.innerText = "STATUS: NO HAND";
                gestureDiv.innerText = "SHOW HAND TO CAMERA";
            }
        }

        // --- Resize & Animation Loop ---
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        function animate() {
            requestAnimationFrame(animate);
            // Add a subtle idle rotation if not pinching
            if (statusDiv.innerText !== "STATUS: PINCHING") {
                activeMesh.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }
        animate();

        // Start everything
        initHands();
    </script>
</body>
</html>
