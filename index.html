<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hologram Interface</title>
    <style>
        body { margin: 0; background: #05050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        #video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1; }
        #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; transform: scaleX(-1); }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        .clip-corner {
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        /* Top Bar Container */
        #top-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 15px; z-index: 10; max-width: 95%;
        }

        #catalog-bar {
            display: flex; gap: 10px; overflow-x: auto;
            padding: 10px; background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(255, 145, 0, 0.4); 
            backdrop-filter: blur(8px);
        }
        .catalog-btn {
            background: transparent; border: 1px solid rgba(255, 145, 0, 0.3);
            color: #ff9100; padding: 8px 12px; font-size: 10px; font-weight: bold;
            cursor: pointer; transition: 0.2s; text-align: center; flex: 1; white-space: nowrap;
        }
        .catalog-btn.active { background: rgba(255, 145, 0, 0.2); border-color: #ff9100; box-shadow: 0 0 10px rgba(255, 145, 0, 0.3); }

        /* Import Button */
        #import-btn {
            background: rgba(15, 15, 25, 0.7); border: 1px solid #ff9100; color: #ff9100;
            padding: 10px 15px; font-size: 12px; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(8px); box-shadow: 0 0 10px rgba(255, 145, 0, 0.3);
            display: flex; align-items: center; justify-content: center; height: 40px;
        }
        #file-input { display: none; }

        #ui-dock {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 160px; height: 50px; background: rgba(15, 15, 25, 0.7);
            border: 1px solid rgba(255, 145, 0, 0.4);
            backdrop-filter: blur(8px); z-index: 10;
            display: flex; justify-content: center; align-items: center;
        }
        .icon { width: 22px; height: 22px; fill: none; stroke: #ff9100; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.3; transition: opacity 0.3s; }
        .icon.active { opacity: 1; filter: drop-shadow(0 0 5px #ff9100); }

        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #05050a; z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 20px; }
        .spinner { border: 2px solid rgba(255, 145, 0, 0.2); border-top: 2px solid #ff9100; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <!-- Top Bar with Catalog and Import -->
    <div id="top-bar">
        <div id="catalog-bar" class="clip-corner">
            <button class="catalog-btn active" onclick="selectShape(0)">CUBE</button>
            <button class="catalog-btn" onclick="selectShape(1)">CONE</button>
            <button class="catalog-btn" onclick="selectShape(2)">SPHERE</button>
            <button class="catalog-btn" onclick="selectShape(3)">TORUS</button>
            <button class="catalog-btn" onclick="selectShape(4)">KNOT</button>
            <button class="catalog-btn" onclick="selectShape(5)">DODEC</button>
            <button class="catalog-btn" onclick="selectShape(6)">ICOSA</button>
            <button class="catalog-btn" onclick="selectShape(7)">CYLIN</button>
            <button class="catalog-btn" onclick="selectShape(8)">TETRA</button>
        </div>
        <input type="file" id="file-input" accept=".glb,.gltf">
        <button id="import-btn" class="clip-corner" onclick="document.getElementById('file-input').click()">IMPORT</button>
    </div>

    <div id="ui-dock" class="clip-corner">
        <svg id="icon-idle" class="icon active" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
        <svg id="icon-scale" class="icon" viewBox="0 0 24 24" style="margin-left: 40px;"><path d="M21 3L9 15"></path><path d="M12 3h9v9"></path><path d="M3 21l12-12"></path><path d="M12 21H3v-9"></path></svg>
        <svg id="icon-rotate" class="icon" viewBox="0 0 24 24" style="margin-left: 40px;"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const threeCanvas = document.getElementById('three-canvas');
        const loader = document.getElementById('loader');

        const icons = { idle: document.getElementById('icon-idle'), scale: document.getElementById('icon-scale'), rotate: document.getElementById('icon-rotate') };
        function setActiveIcon(name) {
            for (const key in icons) icons[key].classList.remove('active');
            if (icons[name]) icons[name].classList.add('active');
        }

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        scene.add(new THREE.AmbientLight(0x00ffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(2, 2, 3);
        scene.add(dirLight);

        // --- INTEGRATED 3D Holographic Shader ---
        const holographicVertexShader = `
            uniform float uTime;
            uniform float uGlitchIntensity;
            uniform float uGlitchFrequency;
            uniform float uRippleFrequency;
            uniform float uRippleSpeed;
            uniform float uRippleHeight;

            varying vec3 vNormal;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            varying float vRipple;

            float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vUv = uv;
                vec3 pos = position;

                float ripple = sin(pos.y * uRippleFrequency - uTime * uRippleSpeed);
                vRipple = ripple;
                pos += normal * ripple * uRippleHeight;

                float glitchTime = floor(uTime * uGlitchFrequency);
                float noiseVal = random(vec2(glitchTime, pos.y * 0.1));
                if (noiseVal > 0.75) {
                    pos.x += (random(vec2(pos.y, uTime)) - 0.5) * uGlitchIntensity;
                    pos.z += (random(vec2(pos.x, uTime)) - 0.5) * uGlitchIntensity;
                }

                vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
        `;

        const holographicFragmentShader = `
            uniform vec3 uColor;
            uniform float uAlpha;
            uniform float uFresnelPower;
            uniform float uFresnelIntensity;
            uniform float uScanlineFrequency;
            uniform float uScanlineSpeed;
            uniform float uTime;

            varying vec3 vNormal;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            varying float vRipple;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(cameraPosition - vWorldPosition);

                float fresnel = pow(1.0 - max(dot(viewDir, normal), 0.0), uFresnelPower) * uFresnelIntensity;
                float scanline = sin(vWorldPosition.y * uScanlineFrequency - uTime * uScanlineSpeed) * 0.5 + 0.5;
                scanline = pow(scanline, 1.5);

                float holoAlpha = (fresnel + scanline * 0.35 + vRipple * 0.1) * uAlpha;
                vec3 finalColor = uColor + vec3(fresnel * 0.5);

                gl_FragColor = vec4(finalColor, clamp(holoAlpha, 0.0, 1.0));
            }
        `;

        const holoMaterial = new THREE.ShaderMaterial({
            vertexShader: holographicVertexShader,
            fragmentShader: holographicFragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color('#00ffff') },
                uAlpha: { value: 0.98 },
                uFresnelPower: { value: 8 },
                uFresnelIntensity: { value: 0.3 },
                uScanlineFrequency: { value: 6 },
                uScanlineSpeed: { value: 15 },
                uGlitchIntensity: { value: 0.05 },
                uGlitchFrequency: { value: 20 },
                uRippleFrequency: { value: 0 },
                uRippleSpeed: { value: 1.3 },
                uRippleHeight: { value: 0 }
            },
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });

        // --- Catalog of Geometries ---
        const geometries = [
            new THREE.BoxGeometry(1.5, 1.5, 1.5),
            new THREE.ConeGeometry(1, 2, 32),
            new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.TorusGeometry(1, 0.4, 16, 100),
            new THREE.TorusKnotGeometry(0.8, 0.25, 100, 16),
            new THREE.DodecahedronGeometry(1.2),
            new THREE.IcosahedronGeometry(1.2),
            new THREE.CylinderGeometry(0.8, 0.8, 2, 32),
            new THREE.TetrahedronGeometry(1.5)
        ];

        let activeMesh = new THREE.Mesh(geometries[0], holoMaterial);
        scene.add(activeMesh);

        // --- GLTF Import Logic ---
        const gltfLoader = new GLTFLoader();
        document.getElementById('file-input').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            
            gltfLoader.load(url, (gltf) => {
                scene.remove(activeMesh);
                activeMesh = gltf.scene;
                
                activeMesh.traverse((child) => {
                    if(child.isMesh) child.material = holoMaterial;
                });
                
                const box = new THREE.Box3().setFromObject(activeMesh);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                activeMesh.scale.multiplyScalar(1.5 / maxDim);
                activeMesh.position.sub(center.multiplyScalar(1.5 / maxDim));
                
                scene.add(activeMesh);
                
                // Deselect catalog buttons
                document.querySelectorAll('.catalog-btn').forEach(btn => btn.classList.remove('active'));
            });
        });

        // --- Particle Aura ---
        const particleCount = 200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) particlePos[i] = (Math.random() - 0.5) * 5;
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.03, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- State & Smoothing ---
        let targetScale = 1.0;
        let currentShapeIndex = 0;
        let targetRotX = 0.0, targetRotY = 0.0, targetRotZ = 0.0;
        let palmHoldStart = 0;
        let baselineDist = null;

        window.selectShape = function(index) {
            if (index === currentShapeIndex) return;
            scene.remove(activeMesh);
            currentShapeIndex = index;
            activeMesh = new THREE.Mesh(geometries[index], holoMaterial);
            scene.add(activeMesh);
            
            document.querySelectorAll('.catalog-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        // --- Hand Tracking ---
        let hands;
        function initHands() {
            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.6 });
            hands.onResults(onResults);
            startRawCamera();
        }

        async function startRawCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } });
                video.srcObject = stream;
                await video.play();
                loader.style.display = 'none';
                processFrame();
            } catch (err) { console.error("Camera error:", err); }
        }

        async function processFrame() {
            if (video.readyState >= 2) await hands.send({ image: video });
            requestAnimationFrame(processFrame);
        }

        function isFist(lm) { return lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y; }
        function isPalm(lm) { return lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y && lm[20].y < lm[18].y; }

        function onResults(results) {
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, { color: 'rgba(255,255,255,0.7)', lineWidth: 1 });
                    drawLandmarks(overlayCtx, landmarks, { color: 'rgba(255,0,0,0.8)', fillColor: 'rgba(255,0,0,0.8)', lineWidth: 0, radius: 3 });
                }
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const handsArr = results.multiHandLandmarks;
                
                if (handsArr.length === 2) {
                    palmHoldStart = 0;
                    const h1 = handsArr[0], h2 = handsArr[1];
                    const h1Fist = isFist(h1), h2Fist = isFist(h2);

                    if (h1Fist || h2Fist) {
                        setActiveIcon("rotate");
                        const rotHand = h1Fist ? h2 : h1;
                        if (!isFist(rotHand)) {
                            targetRotY = (rotHand[0].x - 0.5) * Math.PI * 3;
                            targetRotX = (rotHand[0].y - 0.5) * Math.PI * 3;
                            const wrist = rotHand[0], pinkyMcp = rotHand[17];
                            targetRotZ = Math.atan2(pinkyMcp.y - wrist.y, pinkyMcp.x - wrist.x) - Math.PI/2;
                        }
                    } else {
                        setActiveIcon("scale");
                        const wrist1 = h1[0], wrist2 = h2[0];
                        const dist = Math.hypot(wrist1.x - wrist2.x, wrist1.y - wrist2.y, wrist1.z - wrist2.z);
                        
                        if (baselineDist === null) {
                            baselineDist = dist;
                            targetScale = 1.0; 
                            targetRotX = 0; targetRotY = 0; targetRotZ = 0; 
                        } else {
                            targetScale = Math.max(0.3, Math.min((dist / baselineDist) * 1.2, 3.5));
                        }
                    }
                } else if (handsArr.length === 1) {
                    setActiveIcon("idle");
                    baselineDist = null;
                    const hand = handsArr[0];
                    
                    if (isPalm(hand)) {
                        if (palmHoldStart === 0) palmHoldStart = Date.now();
                        if ((Date.now() - palmHoldStart) / 1000 > 1.5) {
                            selectShape((currentShapeIndex + 1) % geometries.length);
                            palmHoldStart = 0; 
                        }
                    } else {
                        palmHoldStart = 0;
                    }
                }
            } else {
                palmHoldStart = 0;
                baselineDist = null;
                setActiveIcon("idle");
            }
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.elapsedTime;
            
            holoMaterial.uniforms.uTime.value = elapsed;
            
            const smoothFactor = 0.2;
            // Custom scale logic for imported GLTF vs Primitives
            if (activeMesh.isMesh) {
                activeMesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), smoothFactor);
            } else {
                // Preserve the base scale of the GLTF and multiply by target scale
                const baseScale = 1.5 / activeMesh.userData.baseSize || 1; 
                activeMesh.scale.lerp(new THREE.Vector3(baseScale * targetScale, baseScale * targetScale, baseScale * targetScale), smoothFactor);
            }
            
            activeMesh.rotation.x += (targetRotX - activeMesh.rotation.x) * smoothFactor;
            activeMesh.rotation.y += (targetRotY - activeMesh.rotation.y) * smoothFactor;
            activeMesh.rotation.z += (targetRotZ - activeMesh.rotation.z) * smoothFactor;

            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;
            
            renderer.render(scene, camera);
        }
        animate();

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        initHands();
    </script>
</body>
</html>
