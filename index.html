<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Avatar Park</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --accent: #4a9eff;
            --text: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg-color); color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; height: 100vh; height: 100dvh;
            overflow: hidden;
        }
        
        #viewport { flex: 1; position: relative; overflow: hidden; }
        #three-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        
        #instruction-text {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;
            font-size: 0.85rem; pointer-events: none; z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #bottom-panel {
            background: var(--panel-bg); padding: 15px 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 10px;
            height: 140px; flex-shrink: 0;
        }
        #status-bar { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; }
        #action-buttons { display: flex; gap: 10px; }
        .btn {
            background: #2a2e38; color: white; border: 1px solid #444;
            padding: 12px 0; border-radius: 8px; cursor: pointer; font-weight: bold;
            transition: 0.2s; text-align: center; flex: 1; font-size: 0.9rem;
        }
        .btn:active { background: #353a45; transform: scale(0.97); }
        .btn.recording { background: #ff4a6b; border-color: #ff4a6b; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="three-canvas"></canvas>
        <div id="instruction-text">Tap the Avatar's Head, Body, or Hand!</div>
    </div>

    <div id="bottom-panel">
        <div id="status-bar">
            <span id="model-status">Avatar: Loading...</span>
            <span id="touch-status">Touch: Idle</span>
        </div>
        <div id="action-buttons">
            <button id="reset-btn" class="btn">Reset Pose</button>
            <button id="anim-btn" class="btn">Play Idle Anim</button>
            <button id="record-btn" class="btn" disabled>Record</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/+esm';

        // --- Local Files ---
        const modelUrl = './avatar.vrm';
        const externalAnimUrl = './animations.glb'; 

        const threeCanvas = document.getElementById('three-canvas');
        const recordBtn = document.getElementById('record-btn');
        const resetBtn = document.getElementById('reset-btn');
        const animBtn = document.getElementById('anim-btn');

        let vrm = null;
        let isRecording = false;
        let recRecorder;
        let currentAction = 'idle';
        let actionTimer = 0;
        let mixer = null; 
        let externalAnimClip = null;

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1115);
        scene.fog = new THREE.Fog(0x0f1115, 5, 15);

        const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
        camera.position.set(0, 1.4, 2.8);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(1, 2, 1).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        // 3D Grid Floor
        const grid = new THREE.GridHelper(20, 40, 0x4a9eff, 0x222222);
        grid.material.opacity = 0.3;
        grid.material.transparent = true;
        scene.add(grid);

        // Controls
        const controls = new OrbitControls(camera, threeCanvas);
        controls.target.set(0, 1.0, 0);
        controls.enablePan = false;
        controls.minDistance = 1.5;
        controls.maxDistance = 5;
        controls.maxPolarAngle = Math.PI / 1.9; 
        controls.update();

        // --- Loading Animation ---
        const loaderGroup = new THREE.Group();
        const cubeMaterials = [
            new THREE.MeshBasicMaterial({ color: 0xff4a6b }),
            new THREE.MeshBasicMaterial({ color: 0x4a9eff }),
            new THREE.MeshBasicMaterial({ color: 0xffdd00 })
        ];
        const cubes = [];
        for(let i=0; i<3; i++) {
            const cube = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), cubeMaterials[i]);
            cube.position.x = (i - 1) * 0.3;
            loaderGroup.add(cube);
            cubes.push(cube);
        }
        loaderGroup.position.y = 1.0;
        scene.add(loaderGroup);

        // --- Load External Animations ---
        const animLoader = new GLTFLoader();
        animLoader.load(externalAnimUrl, (gltf) => {
            // Extract the "Idle" animation from the file
            gltf.animations.forEach(clip => {
                if (clip.name.toLowerCase().includes('idle')) {
                    externalAnimClip = clip;
                }
            });
            // If no idle found, just use the first one
            if(!externalAnimClip && gltf.animations.length > 0) externalAnimClip = gltf.animations[0];
        });

        // --- VRM Avatar Loading ---
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        
        loader.load(
            modelUrl,
            (gltf) => {
                vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.combineSkeletons(vrm.scene);
                scene.add(vrm.scene);
                vrm.humanoid.resetNormalizedPose();
                
                // FIX 1: Put feet exactly on the grid
                const box = new THREE.Box3().setFromObject(vrm.scene);
                vrm.scene.position.y -= box.min.y; 
                
                // FIX 2: Fix T-Pose (Rotate arms down to relaxed position)
                const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                if (leftUpperArm) leftUpperArm.rotation.z = 0.4; 
                if (rightUpperArm) rightUpperArm.rotation.z = -0.4;

                // Adjust camera target to look at the chest/head level
                const height = box.max.y - box.min.y;
                controls.target.set(0, height * 0.6, 0);
                controls.update();

                mixer = new THREE.AnimationMixer(vrm.scene);
                
                scene.remove(loaderGroup);
                document.getElementById('model-status').innerText = "Avatar: Ready";
                recordBtn.disabled = false;
            },
            (progress) => console.log('Loading model...'),
            (error) => console.error('Error loading VRM:', error)
        );

        // --- Resize Logic ---
        function resizeCanvases() {
            const rect = threeCanvas.getBoundingClientRect();
            renderer.setSize(rect.width, rect.height, false);
            camera.aspect = rect.width / rect.height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // --- Touch Interactivity ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        threeCanvas.addEventListener('pointerdown', (event) => {
            if (!vrm) return;
            const rect = threeCanvas.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObject(vrm.scene, true);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                let boneName = hitObject.name; 
                
                while(hitObject.parent && !hitObject.isBone) {
                    hitObject = hitObject.parent;
                    if(hitObject.name && (hitObject.name.includes('Left') || hitObject.name.includes('Right') || hitObject.name.includes('Head') || hitObject.name.includes('Spine'))) {
                        boneName = hitObject.name;
                        break;
                    }
                }
                handleTouch(boneName);
            }
        });

        function handleTouch(boneName) {
            actionTimer = 0;
            if(mixer) mixer.stopAllAction();
            
            if (boneName.includes('Head')) {
                currentAction = 'nod';
                document.getElementById('touch-status').innerText = "Touched: Head";
                vrm.expressionManager.setValue('happy', 1.0);
                vrm.expressionManager.setValue('surprised', 0);
            } else if (boneName.includes('Hand')) {
                currentAction = 'wave';
                document.getElementById('touch-status').innerText = "Touched: Hand";
                vrm.expressionManager.setValue('surprised', 1.0);
                vrm.expressionManager.setValue('happy', 0);
            } else {
                currentAction = 'jump';
                document.getElementById('touch-status').innerText = "Touched: Body";
                vrm.expressionManager.setValue('surprised', 1.0);
                vrm.expressionManager.setValue('happy', 0);
            }
        }

        // --- Buttons ---
        resetBtn.addEventListener('click', () => {
            currentAction = 'idle';
            actionTimer = 0;
            if (vrm) {
                vrm.expressionManager.setValue('happy', 0);
                vrm.expressionManager.setValue('surprised', 0);
                vrm.humanoid.resetNormalizedPose();
                // Re-apply relaxed arms
                const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                if (leftUpperArm) leftUpperArm.rotation.z = 0.4; 
                if (rightUpperArm) rightUpperArm.rotation.z = -0.4;
            }
            if(mixer) mixer.stopAllAction();
            document.getElementById('touch-status').innerText = "Touch: Idle";
        });

        animBtn.addEventListener('click', () => {
            if (mixer && externalAnimClip) {
                currentAction = 'external';
                mixer.stopAllAction();
                const action = mixer.clipAction(externalAnimClip);
                action.reset();
                action.play();
                document.getElementById('touch-status').innerText = "Playing: External Anim";
            } else {
                alert("External animation not loaded yet!");
            }
        });

        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerText = "Stop";
                const stream = threeCanvas.captureStream(60);
                recRecorder = RecordRTC(stream, {
                    type: 'video', mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000
                });
                recRecorder.startRecording();
            } else {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerText = "Record";
                recRecorder.stopRecording(() => {
                    const blob = recRecorder.getBlob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'avatar-clip.webm'; a.click();
                });
            }
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            controls.update();
            
            // Loading Animation
            if (!vrm) {
                loaderGroup.rotation.y += 0.05;
                loaderGroup.rotation.x += 0.03;
                cubes.forEach((cube, i) => {
                    cube.rotation.x += 0.1 * (i+1);
                    cube.rotation.z += 0.1 * (i+1);
                    cube.position.y = Math.sin(clock.elapsedTime * 3 + i) * 0.2;
                });
                renderer.render(scene, camera);
                return;
            }

            actionTimer += 0.05;

            const hips = vrm.humanoid.getNormalizedBoneNode('hips');
            const head = vrm.humanoid.getNormalizedBoneNode('head');
            const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
            const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
            const rightLowerArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');

            if (currentAction === 'idle') {
                // Procedural Breathing & Relaxed Arms
                if (hips) hips.position.y = Math.sin(clock.elapsedTime * 1.5) * 0.01;
                if (leftUpperArm) leftUpperArm.rotation.x = Math.sin(clock.elapsedTime * 1.5) * 0.05;
                if (rightUpperArm) rightUpperArm.rotation.x = -Math.sin(clock.elapsedTime * 1.5) * 0.05;
            }
            else if (currentAction === 'nod') {
                if (head) head.rotation.x = Math.sin(actionTimer * 5) * 0.3;
                if (actionTimer > 3) resetBtn.click();
            }
            else if (currentAction === 'wave') {
                if (rightUpperArm) rightUpperArm.rotation.z = -1.5;
                if (rightLowerArm) rightLowerArm.rotation.y = Math.sin(actionTimer * 8) * 0.5;
                if (actionTimer > 3) resetBtn.click();
            }
            else if (currentAction === 'jump') {
                if (hips) hips.position.y = Math.abs(Math.sin(actionTimer * 3)) * 0.3;
                if (actionTimer > 2) resetBtn.click();
            }

            if(mixer) mixer.update(delta);
            vrm.update(delta);
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
