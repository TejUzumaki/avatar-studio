<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Avatar Viewer</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: sans-serif; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

        #ui-panel {
            position: absolute; top: 50%; right: 15px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 10;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ui-btn {
            background: #333; color: white; border: none; padding: 8px 12px;
            border-radius: 5px; cursor: pointer; font-size: 12px; text-align: center;
            transition: 0.2s; min-width: 60px;
        }
        .ui-btn:active { background: #555; transform: scale(0.95); }

        #info-text {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 20px;
            font-size: 12px; z-index: 10; border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div id="info-text">Loading Model...</div>

    <div id="ui-panel">
        <button class="ui-btn" onclick="loadModel('./avatar.vrm', true)">VRM</button>
        <button class="ui-btn" onclick="loadModel('./animations.glb', false)">GLB</button>
        <div style="height: 1px; background: #555; margin: 5px 0;"></div>
        <button class="ui-btn" onclick="setCameraView('full')">Full</button>
        <button class="ui-btn" onclick="setCameraView('top')">Top</button>
        <button class="ui-btn" onclick="setCameraView('shoes')">Shoes</button>
        <button class="ui-btn" onclick="setCameraView('front')">Front</button>
        <button class="ui-btn" onclick="setCameraView('back')">Back</button>
    </div>

    <!-- Official Pre-built Import Map from README -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        // Clean import from the official pre-built module
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.3, 3.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        // Plain Floor
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.0, 0);
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2; 
        controls.update();

        // --- Loading Cubes ---
        const loaderGroup = new THREE.Group();
        const cubes = [];
        for(let i=0; i<3; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: [0xff4a6b, 0x4a9eff, 0xffdd00][i] });
            const cube = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), mat);
            cube.position.x = (i - 1) * 0.3;
            loaderGroup.add(cube);
            cubes.push(cube);
        }
        loaderGroup.position.y = 1.0;
        scene.add(loaderGroup);

        // --- Model & Animation State ---
        let currentModel = null;
        let vrm = null;
        let mixer = null;
        let animations = [];
        let currentAnimIndex = 0;
        let animTimeout = null;

        const loader = new GLTFLoader();
        loader.register((parser) => {
            return new VRMLoaderPlugin(parser);
        });

        window.loadModel = function(url, isVRM) {
            if (currentModel) {
                scene.remove(currentModel);
                if (vrm) vrm.destroy();
                currentModel = null;
                vrm = null;
            }
            if (mixer) {
                mixer.stopAllAction();
                mixer = null;
            }
            if (animTimeout) clearTimeout(animTimeout);
            
            scene.add(loaderGroup);
            document.getElementById('info-text').innerText = "Loading Model...";

            loader.load(
                url,
                (gltf) => {
                    scene.remove(loaderGroup);
                    
                    if (isVRM) {
                        vrm = gltf.userData.vrm;
                        VRMUtils.removeUnnecessaryVertices(gltf.scene);
                        VRMUtils.combineSkeletons(vrm.scene);
                        currentModel = vrm.scene;
                        
                        const leftArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                        const rightArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                        if (leftArm) leftArm.rotation.z = 0.3;
                        if (rightArm) rightArm.rotation.z = -0.3;
                    } else {
                        currentModel = gltf.scene;
                        currentModel.scale.set(1.5, 1.5, 1.5);
                        currentModel.rotation.y = Math.PI;
                    }

                    scene.add(currentModel);

                    const box = new THREE.Box3().setFromObject(currentModel);
                    currentModel.position.y -= box.min.y;

                    if (gltf.animations && gltf.animations.length > 0) {
                        animations = gltf.animations;
                        mixer = new THREE.AnimationMixer(currentModel);
                        playNextAnimation();
                        document.getElementById('info-text').innerText = "Model Loaded (Cycling Animations)";
                    } else {
                        document.getElementById('info-text').innerText = "Model Loaded (No built-in anims)";
                    }
                },
                undefined,
                (error) => console.error(error)
            );
        }

        function playNextAnimation() {
            if (!mixer || animations.length === 0) return;
            
            mixer.stopAllAction();
            const clip = animations[currentAnimIndex];
            const action = mixer.clipAction(clip);
            action.reset();
            action.play();
            
            const duration = clip.duration ? clip.duration * 1000 : 5000;
            animTimeout = setTimeout(() => {
                currentAnimIndex = (currentAnimIndex + 1) % animations.length;
                playNextAnimation();
            }, duration);
        }

        // --- Camera Presets ---
        let camLerpActive = false;
        let camLerpTime = 0;
        const camStartPos = new THREE.Vector3();
        const camEndPos = new THREE.Vector3();
        const camStartTarget = new THREE.Vector3();
        const camEndTarget = new THREE.Vector3();

        window.setCameraView = function(view) {
            controls.enabled = false;
            camLerpActive = true;
            camLerpTime = 0;
            camStartPos.copy(camera.position);
            camStartTarget.copy(controls.target);

            switch(view) {
                case 'full': camEndPos.set(0, 1.3, 3.0); camEndTarget.set(0, 1.0, 0); break;
                case 'top': camEndPos.set(0, 3.0, 0.1); camEndTarget.set(0, 1.0, 0); break;
                case 'shoes': camEndPos.set(0, 0.3, 1.0); camEndTarget.set(0, 0.0, 0); break;
                case 'front': camEndPos.set(0, 1.2, 2.0); camEndTarget.set(0, 1.0, 0); break;
                case 'back': camEndPos.set(0, 1.2, -2.0); camEndTarget.set(0, 1.0, 0); break;
            }
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (scene.children.includes(loaderGroup)) {
                loaderGroup.rotation.y += 0.05;
                cubes.forEach((c, i) => {
                    c.rotation.x += 0.1 * (i+1);
                    c.rotation.z += 0.1 * (i+1);
                    c.position.y = Math.sin(clock.elapsedTime * 3 + i) * 0.2;
                });
            }

            if (camLerpActive) {
                camLerpTime += delta * 2;
                let t = Math.min(camLerpTime, 1);
                t = t<.5 ? 2*t*t : -1+(4-2*t)*t;
                camera.position.lerpVectors(camStartPos, camEndPos, t);
                controls.target.lerpVectors(camStartTarget, camEndTarget, t);
                if (t >= 1) {
                    camLerpActive = false;
                    controls.enabled = true;
                }
            }

            if (mixer) mixer.update(delta);
            if (vrm) vrm.update(delta);
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadModel('./avatar.vrm', true);
    </script>
</body>
</html>
