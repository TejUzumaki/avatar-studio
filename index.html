<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Avatar Viewer</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    </style>
</head>
<body>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/+esm';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.3, 3.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Basic Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        // Plain Floor
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.0, 0);
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2; // Prevent going under floor
        controls.update();

        // VRM Loader
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        
        let vrm = null;
        let mixer = null;
        let animations = [];
        let currentAnimIndex = 0;

        loader.load(
            './avatar.vrm',
            (gltf) => {
                vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.combineSkeletons(vrm.scene);
                scene.add(vrm.scene);
                
                // Align feet exactly to the floor (no clipping)
                const box = new THREE.Box3().setFromObject(vrm.scene);
                vrm.scene.position.y -= box.min.y;

                // Check for built-in animations in the VRM
                if (gltf.animations && gltf.animations.length > 0) {
                    animations = gltf.animations;
                    mixer = new THREE.AnimationMixer(vrm.scene);
                    playNextAnimation();
                }
            },
            undefined,
            (error) => console.error(error)
        );

        function playNextAnimation() {
            if (!mixer || animations.length === 0) return;
            
            mixer.stopAllAction();
            const clip = animations[currentAnimIndex];
            const action = mixer.clipAction(clip);
            action.reset();
            action.play();
            
            // Cycle to the next animation after the current one finishes
            const duration = clip.duration ? clip.duration * 1000 : 5000;
            setTimeout(() => {
                currentAnimIndex = (currentAnimIndex + 1) % animations.length;
                playNextAnimation();
            }, duration);
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (mixer) mixer.update(delta);
            if (vrm) vrm.update(delta);
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
