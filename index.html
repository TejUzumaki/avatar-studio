<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Rig Editor</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: sans-serif; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

        #ui-panel {
            position: absolute; top: 50%; right: 15px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 10;
            background: rgba(0,0,0,0.6); padding: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .ui-btn {
            background: #333; color: white; border: none; padding: 10px 14px;
            border-radius: 6px; cursor: pointer; font-size: 12px; text-align: center;
            transition: 0.2s; min-width: 70px;
        }
        .ui-btn:active { background: #555; transform: scale(0.95); }
        .ui-btn.active { background: #4a9eff; color: white; }

        #info-text {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px;
            font-size: 13px; z-index: 10; border: 1px solid rgba(255,255,255,0.2);
        }
        
        #file-input { display: none; }
    </style>
</head>
<body>
    <div id="info-text">Rig Editor: Load a model to begin</div>
    
    <input type="file" id="file-input" accept=".vrm,.glb,.gltf,.fbx">

    <div id="ui-panel">
        <button class="ui-btn" onclick="document.getElementById('file-input').click()">Import</button>
        <div style="height: 1px; background: #555; margin: 5px 0;"></div>
        <button class="ui-btn" id="btn-skeleton" onclick="toggleSkeleton()">Show Rig</button>
        <div style="height: 1px; background: #555; margin: 5px 0;"></div>
        <button class="ui-btn active" id="btn-rotate" onclick="setGizmoMode('rotate')">Rotate</button>
        <button class="ui-btn" id="btn-translate" onclick="setGizmoMode('translate')">Move</button>
        <div style="height: 1px; background: #555; margin: 5px 0;"></div>
        <button class="ui-btn" onclick="setCameraView('full')">Full</button>
        <button class="ui-btn" onclick="setCameraView('top')">Top</button>
    </div>

    <!-- Official Import Map -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        // Grid Floor
        const grid = new THREE.GridHelper(20, 40, 0x4a9eff, 0x333333);
        grid.material.opacity = 0.4;
        grid.material.transparent = true;
        scene.add(grid);

        // Controls
        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.target.set(0, 1.0, 0);
        orbit.update();

        // Transform Controls (Gizmo)
        const transformControls = new TransformControls(camera, renderer.domElement);
        scene.add(transformControls);
        
        // Disable Orbit controls while dragging gizmo
        transformControls.addEventListener('dragging-changed', (event) => {
            orbit.enabled = !event.value;
        });

        // --- Model & Rig State ---
        let currentModel = null;
        let skeletonHelper = null;
        let bones = [];
        let showRig = false;

        // Loaders
        const gltfLoader = new GLTFLoader();
        gltfLoader.register((parser) => new VRMLoaderPlugin(parser));
        const fbxLoader = new FBXLoader();

        // File Input Handling
        document.getElementById('file-input').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (ext === 'fbx') loadModel(url, 'fbx');
            else if (ext === 'vrm') loadModel(url, 'vrm');
            else loadModel(url, 'gltf');
        });

        function clearModel() {
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }
            if (skeletonHelper) {
                scene.remove(skeletonHelper);
                skeletonHelper = null;
            }
            bones = [];
            transformControls.detach();
        }

        function loadModel(url, type) {
            clearModel();
            document.getElementById('info-text').innerText = "Loading Model...";

            const onLoad = (object, isVRM) => {
                currentModel = isVRM ? object.scene : object;
                scene.add(currentModel);

                if (isVRM) {
                    const leftArm = object.humanoid.getNormalizedBoneNode('leftUpperArm');
                    if (leftArm) leftArm.rotation.z = 0.3;
                }

                // Align to floor
                const box = new THREE.Box3().setFromObject(currentModel);
                currentModel.position.y -= box.min.y;

                // Find Skeleton
                currentModel.traverse((child) => {
                    if (child.isBone) bones.push(child);
                });

                if (bones.length > 0) {
                    skeletonHelper = new THREE.SkeletonHelper(currentModel);
                    skeletonHelper.visible = false; // Hidden by default
                    scene.add(skeletonHelper);
                    document.getElementById('info-text').innerText = `Model Loaded (${bones.length} bones found)`;
                    toggleSkeleton(); // Auto show rig on load
                } else {
                    document.getElementById('info-text').innerText = "Model Loaded (No bones found)";
                }
            };

            if (type === 'fbx') {
                fbxLoader.load(url, (obj) => onLoad(obj, false), undefined, console.error);
            } else {
                gltfLoader.load(url, (gltf) => {
                    let isVRM = false;
                    if (gltf.userData.vrm) {
                        isVRM = true;
                        VRMUtils.removeUnnecessaryVertices(gltf.scene);
                        onLoad(gltf.userData.vrm, true);
                    } else {
                        onLoad(gltf, false);
                    }
                }, undefined, console.error);
            }
        }

        window.toggleSkeleton = function() {
            showRig = !showRig;
            if (skeletonHelper) skeletonHelper.visible = showRig;
            document.getElementById('btn-skeleton').classList.toggle('active', showRig);
        }

        window.setGizmoMode = function(mode) {
            transformControls.setMode(mode);
            document.getElementById('btn-rotate').classList.toggle('active', mode === 'rotate');
            document.getElementById('btn-translate').classList.toggle('active', mode === 'translate');
        }

        // --- Bone Selection (Raycaster) ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return; // Left click only
            
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            
            // Only intersect with bones if rig is visible
            if (bones.length > 0 && showRig) {
                const intersects = raycaster.intersectObjects(bones, true);
                if (intersects.length > 0) {
                    // Attach gizmo to the clicked bone
                    transformControls.attach(intersects[0].object);
                    document.getElementById('info-text').innerText = `Selected: ${intersects[0].object.name}`;
                }
            }
        });

        // --- Camera Presets ---
        let camLerpActive = false;
        let camLerpTime = 0;
        const camStartPos = new THREE.Vector3();
        const camEndPos = new THREE.Vector3();
        const camStartTarget = new THREE.Vector3();
        const camEndTarget = new THREE.Vector3();

        window.setCameraView = function(view) {
            orbit.enabled = false;
            camLerpActive = true;
            camLerpTime = 0;
            camStartPos.copy(camera.position);
            camStartTarget.copy(orbit.target);

            switch(view) {
                case 'full': camEndPos.set(0, 1.5, 3.5); camEndTarget.set(0, 1.0, 0); break;
                case 'top': camEndPos.set(0, 3.5, 0.1); camEndTarget.set(0, 1.0, 0); break;
            }
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (camLerpActive) {
                camLerpTime += delta * 2;
                let t = Math.min(camLerpTime, 1);
                t = t<.5 ? 2*t*t : -1+(4-2*t)*t;
                camera.position.lerpVectors(camStartPos, camEndPos, t);
                orbit.target.lerpVectors(camStartTarget, camEndTarget, t);
                if (t >= 1) {
                    camLerpActive = false;
                    orbit.enabled = true;
                }
            }

            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
