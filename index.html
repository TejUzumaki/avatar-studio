<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Avatar Park</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --accent: #4a9eff;
            --text: #ffffff;
        }
        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 280px;
            background: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        h1 { font-size: 1.5rem; margin: 0; color: var(--accent); }
        h2 { font-size: 1.1rem; margin: 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .btn {
            background: #2a2e38; color: white; border: 1px solid #444;
            padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;
            transition: 0.2s; text-align: center;
        }
        .btn:hover { background: #353a45; }
        .btn.recording { background: var(--accent); border-color: var(--accent); }
        .status { font-size: 0.8rem; color: #888; text-align: center; margin-top: 5px; }

        #stage-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            position: relative; background: #000;
        }
        #viewport-wrapper {
            position: relative; width: 100%; height: 100%;
            max-width: calc(100vh * 9 / 16);
        }
        #three-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            cursor: pointer; touch-action: none;
        }
        #instruction-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px;
            font-size: 0.9rem; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <h1>Avatar Park</h1>
            <p style="font-size: 0.8rem; color: #aaa; margin: 5px 0 0 0;">Touch Interactive 3D Models</p>
        </div>

        <div>
            <h2>Avatar Status</h2>
            <div id="model-status" class="status">Avatar: Loading...</div>
            <div id="touch-status" class="status">Touch: Idle</div>
        </div>

        <div>
            <h2>Video Export (9:16)</h2>
            <button id="record-btn" class="btn" disabled>Start Recording</button>
            <div id="rec-status" class="status">Status: Idle</div>
        </div>

        <div>
            <h2>Controls</h2>
            <button id="reset-btn" class="btn">Reset Pose</button>
        </div>
        
        <div style="margin-top: auto; font-size: 0.7rem; color: #555;">
            To use your own model: <br>
            1. Put model.vrm in folder<br>
            2. Change modelUrl variable
        </div>
    </div>

    <div id="stage-container">
        <div id="viewport-wrapper">
            <canvas id="three-canvas"></canvas>
            <div id="instruction-text">Tap the Avatar's Head, Body, or Hand!</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/+esm';

        // --- Configuration ---
        // You can replace this URL with a local file like './my-avatar.vrm'
        const modelUrl = 'https://cdn.jsdelivr.net/gh/pixiv/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm';

        const threeCanvas = document.getElementById('three-canvas');
        const recordBtn = document.getElementById('record-btn');
        const resetBtn = document.getElementById('reset-btn');
        const wrapper = document.getElementById('viewport-wrapper');

        let vrm = null;
        let isRecording = false;
        let recRecorder;
        let currentAction = 'idle';
        let actionTimer = 0;

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1d24);

        const camera = new THREE.PerspectiveCamera(30, 9/16, 0.1, 100);
        camera.position.set(0, 1.3, 2.5);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(1, 1.5, 1).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // Controls (Orbit camera)
        const controls = new OrbitControls(camera, threeCanvas);
        controls.target.set(0, 1.2, 0);
        controls.enablePan = false;
        controls.minDistance = 1.5;
        controls.maxDistance = 4;
        controls.update();

        // --- VRM Avatar Loading ---
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        
        loader.load(
            modelUrl,
            (gltf) => {
                vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.combineSkeletons(vrm.scene);
                scene.add(vrm.scene);
                vrm.humanoid.resetNormalizedPose();
                
                document.getElementById('model-status').innerText = "Avatar: Ready";
                recordBtn.disabled = false;
            },
            (progress) => console.log('Loading model...', progress),
            (error) => console.error('Error loading VRM:', error)
        );

        function resizeCanvases() {
            const rect = wrapper.getBoundingClientRect();
            renderer.setSize(rect.width, rect.height, false);
            camera.aspect = rect.width / rect.height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // --- Touch Interactivity (Raycaster) ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        threeCanvas.addEventListener('pointerdown', (event) => {
            if (!vrm) return;

            const rect = threeCanvas.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObject(vrm.scene, true);

            if (intersects.length > 0) {
                // Get the first object hit and trace it back to its bone
                let hitObject = intersects[0].object;
                let boneName = hitObject.name; 
                
                // Traverse up to find the actual bone name if it's a skinned mesh
                while(hitObject.parent && !hitObject.isBone) {
                    hitObject = hitObject.parent;
                    if(hitObject.name && hitObject.name.includes('Left') || hitObject.name.includes('Right') || hitObject.name.includes('Head') || hitObject.name.includes('Spine')) {
                        boneName = hitObject.name;
                        break;
                    }
                }

                handleTouch(boneName);
            }
        });

        function handleTouch(boneName) {
            actionTimer = 0; // Reset timer for new action
            
            if (boneName.includes('Head')) {
                currentAction = 'nod';
                document.getElementById('touch-status').innerText = "Touched: Head (Happy)";
                vrm.expressionManager.setValue('happy', 1.0);
            } else if (boneName.includes('Hand')) {
                currentAction = 'wave';
                document.getElementById('touch-status').innerText = "Touched: Hand (Wave)";
                vrm.expressionManager.setValue('surprised', 1.0);
            } else {
                currentAction = 'jump';
                document.getElementById('touch-status').innerText = "Touched: Body (Jump)";
                vrm.expressionManager.setValue('surprised', 1.0);
            }
        }

        // Reset Button
        resetBtn.addEventListener('click', () => {
            currentAction = 'idle';
            actionTimer = 0;
            if (vrm) {
                vrm.expressionManager.setValue('happy', 0);
                vrm.expressionManager.setValue('surprised', 0);
                vrm.humanoid.resetNormalizedPose();
            }
            document.getElementById('touch-status').innerText = "Touch: Idle";
        });

        // --- Video Export ---
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerText = "Stop Recording";
                document.getElementById('rec-status').innerText = "Status: Recording 9:16...";

                const stream = threeCanvas.captureStream(60);
                recRecorder = RecordRTC(stream, {
                    type: 'video',
                    mimeType: 'video/webm;codecs=vp9',
                    videoBitsPerSecond: 8000000
                });
                recRecorder.startRecording();
            } else {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerText = "Start Recording";
                document.getElementById('rec-status').innerText = "Status: Processing...";

                recRecorder.stopRecording(() => {
                    const blob = recRecorder.getBlob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'avatar-clip.webm';
                    a.click();
                    document.getElementById('rec-status').innerText = "Status: Saved!";
                });
            }
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            if (!vrm) {
                renderer.render(scene, camera);
                return;
            }

            actionTimer += 0.05;

            // Procedural Animations
            const hips = vrm.humanoid.getNormalizedBoneNode('hips');
            const head = vrm.humanoid.getNormalizedBoneNode('head');
            const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');

            // Default idle state (reset slightly)
            if (currentAction === 'idle') {
                if (hips) hips.position.y = THREE.MathUtils.lerp(hips.position.y, 0, 0.1);
                if (head) head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, 0, 0.1);
                if (rightUpperArm) rightUpperArm.rotation.z = THREE.MathUtils.lerp(rightUpperArm.rotation.z, 0, 0.1);
            }
            // Nod animation
            else if (currentAction === 'nod') {
                if (head) head.rotation.x = Math.sin(actionTimer * 5) * 0.3;
                if (hips) hips.position.y = THREE.MathUtils.lerp(hips.position.y, 0, 0.1);
                if (actionTimer > 3) resetBtn.click(); // Auto reset after 3 secs
            }
            // Wave animation
            else if (currentAction === 'wave') {
                if (rightUpperArm) {
                    rightUpperArm.rotation.z = -1.5; // Raise arm
                    if (vrm.humanoid.getNormalizedBoneNode('rightLowerArm')) {
                        vrm.humanoid.getNormalizedBoneNode('rightLowerArm').rotation.y = Math.sin(actionTimer * 8) * 0.5;
                    }
                }
                if (actionTimer > 3) resetBtn.click();
            }
            // Jump animation
            else if (currentAction === 'jump') {
                if (hips) hips.position.y = Math.abs(Math.sin(actionTimer * 3)) * 0.3;
                if (actionTimer > 2) resetBtn.click();
            }

            vrm.update(1/60);
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
