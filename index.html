<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stylus Avatar Studio</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --accent: #ff4a6b;
            --text: #ffffff;
        }
        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 280px;
            background: var(--panel-bg);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        h1 { font-size: 1.5rem; margin: 0; color: var(--accent); }
        h2 { font-size: 1.1rem; margin: 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .btn {
            background: #2a2e38;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-align: center;
        }
        .btn:hover { background: #353a45; }
        .btn.recording { background: var(--accent); border-color: var(--accent); }

        #stage-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }
        /* 9:16 Aspect Ratio Container */
        #viewport-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * 9 / 16); /* Fit height */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none; /* Important for stylus pressure */
        }
        .status { font-size: 0.8rem; color: #888; text-align: center; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <h1>Avatar Studio</h1>
            <p style="font-size: 0.8rem; color: #aaa; margin: 5px 0 0 0;">Stylus-driven 3D IK & Lip-Sync</p>
        </div>

        <div>
            <h2>Audio & Lip-Sync</h2>
            <button id="mic-btn" class="btn">Enable Microphone</button>
            <div id="mic-status" class="status">Mic: Off</div>
        </div>

        <div>
            <h2>Video Export (9:16)</h2>
            <button id="record-btn" class="btn">Start Recording</button>
            <div id="rec-status" class="status">Status: Idle</div>
        </div>

        <div>
            <h2>Canvas Tools</h2>
            <button id="clear-btn" class="btn">Clear Drawing</button>
        </div>
        
        <div style="margin-top: auto; font-size: 0.7rem; color: #555;">
            Libraries: Three.js, @pixiv/three-vrm, Perfect-Freehand, RecordRTC
        </div>
    </div>

    <div id="stage-container">
        <div id="viewport-wrapper">
            <!-- Three.js 3D Scene -->
            <canvas id="three-canvas"></canvas>
            <!-- 2D Drawing Overlay -->
            <canvas id="draw-canvas"></canvas>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>
    
    <script type="importmap">
    {
        "imports": {
            {
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/+esm';
        import { getStroke } from 'https://cdn.jsdelivr.net/npm/perfect-freehand@1.2.2/+esm';

        // --- DOM Elements ---
        const threeCanvas = document.getElementById('three-canvas');
        const drawCanvas = document.getElementById('draw-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        const micBtn = document.getElementById('mic-btn');
        const recordBtn = document.getElementById('record-btn');
        const clearBtn = document.getElementById('clear-btn');
        const wrapper = document.getElementById('viewport-wrapper');

        // --- State Variables ---
        let vrm = null;
        let currentStroke = [];
        let allStrokes = [];
        let isDrawing = false;
        let audioContext, analyser, micStream, recRecorder;
        let isRecording = false;

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1d24);

        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
        camera.position.set(0, 1.35, 2.5);
        camera.lookAt(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        // Lighting for MToon Shader
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(1, 1.5, 1).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // --- VRM Avatar Loading ---
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        
        // Using a public domain VRM sample model
        loader.load(
            'https://cdn.jsdelivr.net/gh/pixiv/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm',
            (gltf) => {
                vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.combineSkeletons(vrm.scene);
                scene.add(vrm.scene);
                
                // Reset pose to ensure arms are down initially
                vrm.humanoid.resetNormalizedPose();
            },
            (progress) => console.log('Loading model...', progress),
            (error) => console.error('Error loading VRM:', error)
        );

        // --- 2D Drawing Setup (Perfect-Freehand) ---
        function resizeCanvases() {
            const rect = wrapper.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            
            drawCanvas.width = w;
            drawCanvas.height = h;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        drawCanvas.addEventListener('pointerdown', (e) => {
            isDrawing = true;
            currentStroke = [{
                x: e.offsetX,
                y: e.offsetY,
                pressure: e.pressure > 0 ? e.pressure : 0.5 // Fallback for mouse
            }];
        });

        drawCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            currentStroke.push({
                x: e.offsetX,
                y: e.offsetY,
                pressure: e.pressure > 0 ? e.pressure : 0.5
            });
            
            // Render the stroke on 2D canvas
            renderStrokes();
            
            // Map 2D drawing to 3D IK target
            updateArmIK(e.offsetX, e.offsetY);
        });

        drawCanvas.addEventListener('pointerup', () => {
            if (isDrawing && currentStroke.length > 0) {
                allStrokes.push(currentStroke);
            }
            isDrawing = false;
            currentStroke = [];
        });

        function renderStrokes() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            
            const renderStroke = (stroke) => {
                const outline = getStroke(stroke, {
                    size: 6,
                    thinning: 0.8,     // Reacts to stylus pressure
                    smoothing: 0.5,
                    streamline: 0.5
                });
                
                if (outline.length === 0) return;
                drawCtx.beginPath();
                drawCtx.moveTo(outline[0][0], outline[0][1]);
                for (let i = 1; i < outline.length; i++) {
                    drawCtx.lineTo(outline[i][0], outline[i][1]);
                }
                drawCtx.closePath();
                drawCtx.fillStyle = '#ff4a6b';
                drawCtx.fill();
            };

            allStrokes.forEach(renderStroke);
            if (isDrawing) renderStroke(currentStroke);
        }

        // --- Kinematic IK Engine (Arm Mapping) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const targetWorldPos = new THREE.Vector3();
        
        // Create a virtual plane in 3D space that represents the 2D drawing canvas
        const drawingPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.5); // Z = 0.5

        function updateArmIK(x, y) {
            // Normalize 2D coordinates to [-1, 1]
            mouse.x = (x / drawCanvas.width) * 2 - 1;
            mouse.y = -(y / drawCanvas.height) * 2 + 1;
            
            // Cast a ray from camera through the 2D point
            raycaster.setFromCamera(mouse, camera);
            
            // Find intersection with the virtual drawing plane
            if (raycaster.ray.intersectPlane(drawingPlane, targetWorldPos)) {
                // Target acquired. The animation loop will handle actual bone rotation.
            }
        }

        // --- Web Audio API (Lip-Sync) ---
        micBtn.addEventListener('click', async () => {
            if (micStream) return;
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                
                document.getElementById('mic-status').innerText = "Mic: Active";
                micBtn.innerText = "Mic Active";
                micBtn.disabled = true;
            } catch (err) {
                alert("Microphone access denied. Lip-sync disabled.");
            }
        });

        // --- Vertical Clip Exporter (RecordRTC) ---
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerText = "Stop Recording";
                document.getElementById('rec-status').innerText = "Status: Recording 9:16...";

                // Capture the Three.js canvas at 60fps
                const stream = threeCanvas.captureStream(60);
                recRecorder = RecordRTC(stream, {
                    type: 'video',
                    mimeType: 'video/webm;codecs=vp9',
                    videoBitsPerSecond: 8000000
                });
                recRecorder.startRecording();
            } else {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerText = "Start Recording";
                document.getElementById('rec-status').innerText = "Status: Processing...";

                recRecorder.stopRecording(() => {
                    const blob = recRecorder.getBlob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'avatar-clip.webm';
                    a.click();
                    document.getElementById('rec-status').innerText = "Status: Saved!";
                });
            }
        });

        clearBtn.addEventListener('click', () => {
            allStrokes = [];
            currentStroke = [];
            renderStrokes();
        });

        // --- Simple IK Bone Alignment ---
        // Utility vectors
        const _v3a = new THREE.Vector3();
        const _v3b = new THREE.Vector3();
        const _q = new THREE.Quaternion();
        const _parentQ = new THREE.Quaternion();

        function pointBoneAt(bone, target) {
            if (!bone) return;
            const bonePos = bone.getWorldPosition(new THREE.Vector3());
            
            _v3a.subVectors(target, bonePos).normalize(); // Direction
            _v3b.set(0, 1, 0); // Default bone orientation (Y-up)
            
            _q.setFromUnitVectors(_v3b, _v3a); // Quaternion to rotate Y to direction
            
            if (bone.parent) {
                bone.parent.getWorldQuaternion(_parentQ).invert();
                _q.premultiply(_parentQ); // Convert to local space
            }
            bone.quaternion.slerp(_q, 0.15); // Smooth interpolation
        }

        // --- Animation Loop ---
        let previousVolume = 0;
        function animate() {
            requestAnimationFrame(animate);
            if (!vrm) return;

            // 1. Audio Lip-Sync
            if (analyser) {
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                let avg = sum / dataArray.length / 100; // Normalize roughly 0-1
                avg = Math.min(avg, 1.0);
                
                // Smooth volume
                previousVolume = previousVolume * 0.8 + avg * 0.2;
                vrm.expressionManager.setValue('aa', previousVolume); // 'aa' is mouth open
            }

            // 2. Arm IK
            const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
            const rightLowerArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
            const rightHand = vrm.humanoid.getNormalizedBoneNode('rightHand');

            if (rightUpperArm) pointBoneAt(rightUpperArm, targetWorldPos);
            if (rightLowerArm) pointBoneAt(rightLowerArm, targetWorldPos);
            if (rightHand) pointBoneAt(rightHand, targetWorldPos);

            // 3. Update VRM
            vrm.update(1/60);
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
