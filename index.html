<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Holographic Manipulator</title>
    <style>
        body { margin: 0; background: #05050a; overflow: hidden; font-family: sans-serif; color: white; }
        #video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1; }
        #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; transform: scaleX(-1); /* Mirror */ }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* Premium UI Dock */
        #ui-dock {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 180px; height: 56px; background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 28px;
            backdrop-filter: blur(10px); z-index: 10;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
            transition: all 0.3s ease;
        }
        .icon { width: 24px; height: 24px; fill: none; stroke: #00e5ff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.3; transition: opacity 0.3s; }
        .icon.active { opacity: 1; filter: drop-shadow(0 0 5px #00e5ff); }

        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #05050a; z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 20px; }
        .spinner { border: 2px solid rgba(0, 229, 255, 0.2); border-top: 2px solid #00e5ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <div id="ui-dock">
        <!-- IDLE SVG -->
        <svg id="icon-idle" class="icon active" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
        <!-- SCALE SVG -->
        <svg id="icon-scale" class="icon" viewBox="0 0 24 24" style="margin-left: 40px;"><path d="M21 3L9 15"></path><path d="M12 3h9v9"></path><path d="M3 21l12-12"></path><path d="M12 21H3v-9"></path></svg>
        <!-- ROTATE SVG -->
        <svg id="icon-rotate" class="icon" viewBox="0 0 24 24" style="margin-left: 40px;"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>

    <!-- Three.js -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const threeCanvas = document.getElementById('three-canvas');
        const loader = document.getElementById('loader');

        const icons = {
            idle: document.getElementById('icon-idle'),
            scale: document.getElementById('icon-scale'),
            rotate: document.getElementById('icon-rotate')
        };

        function setActiveIcon(name) {
            for (const key in icons) icons[key].classList.remove('active');
            if (icons[name]) icons[name].classList.add('active');
        }

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting
        scene.add(new THREE.AmbientLight(0x00e5ff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(2, 2, 3);
        scene.add(dirLight);

        // --- Holographic Materials & Geometries ---
        const holoMatCore = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
        const holoMatWire = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.8 });
        
        const geometries = [
            new THREE.BoxGeometry(1.5, 1.5, 1.5),
            new THREE.ConeGeometry(1, 2, 32),
            new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.TorusGeometry(1, 0.4, 16, 100)
        ];

        let activeMeshGroup = new THREE.Group();
        activeMeshGroup.add(new THREE.Mesh(geometries[0], holoMatCore));
        activeMeshGroup.add(new THREE.Mesh(geometries[0], holoMatWire));
        scene.add(activeMeshGroup);

        // --- Particle Aura ---
        const particleCount = 150;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) particlePos[i] = (Math.random() - 0.5) * 4;
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x00e5ff, size: 0.04, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(particleGeo, particleMat);
        activeMeshGroup.add(particles);

        // --- Smoothing & State ---
        let targetScale = 1.0;
        let targetRotX = 0.0;
        let targetRotY = 0.0;
        let targetRotZ = 0.0;
        let currentShapeIndex = 0;
        let palmHoldStart = 0;
        let baselineDist = null; // Used for relative scaling

        // --- Hand Tracking ---
        let hands;
        function initHands() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
            });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.6
            });
            hands.onResults(onResults);
            startRawCamera(); // Bypass MediaPipe Camera Utility for zero latency
        }

        async function startRawCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                await video.play();
                loader.style.display = 'none';
                processFrame();
            } catch (err) {
                console.error("Camera error:", err);
            }
        }

        // Zero-latency processing loop
        async function processFrame() {
            if (video.readyState >= 2) {
                await hands.send({ image: video });
            }
            requestAnimationFrame(processFrame);
        }

        function isFist(lm) {
            return lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
        }
        function isPalm(lm) {
            return lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y && lm[20].y < lm[18].y;
        }

        function onResults(results) {
            // 1. Draw Premium Skeleton
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Thin white lines
                    drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, { color: 'rgba(255,255,255,0.7)', lineWidth: 1 });
                    // Small red dots
                    drawLandmarks(overlayCtx, landmarks, { color: 'rgba(255,0,0,0.8)', fillColor: 'rgba(255,0,0,0.8)', lineWidth: 0, radius: 3 });
                }
            }

            // 2. 3D Manipulation Logic
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const handsArr = results.multiHandLandmarks;
                
                if (handsArr.length === 2) {
                    palmHoldStart = 0;
                    const h1 = handsArr[0];
                    const h2 = handsArr[1];

                    const h1Fist = isFist(h1);
                    const h2Fist = isFist(h2);

                    if (h1Fist || h2Fist) {
                        // --- ROTATE MODE ---
                        setActiveIcon("rotate");
                        const rotHand = h1Fist ? h2 : h1;
                        
                        if (!isFist(rotHand)) {
                            targetRotY = (rotHand[0].x - 0.5) * Math.PI * 3;
                            targetRotX = (rotHand[0].y - 0.5) * Math.PI * 3;
                            const wrist = rotHand[0];
                            const pinkyMcp = rotHand[17];
                            targetRotZ = Math.atan2(pinkyMcp.y - wrist.y, pinkyMcp.x - wrist.x) - Math.PI/2;
                        }
                    } else {
                        // --- SCALE MODE ---
                        setActiveIcon("scale");
                        const wrist1 = h1[0];
                        const wrist2 = h2[0];
                        const dist = Math.hypot(wrist1.x - wrist2.x, wrist1.y - wrist2.y, wrist1.z - wrist2.z);
                        
                        // Initialize baseline distance on first detection
                        if (baselineDist === null) {
                            baselineDist = dist;
                            targetScale = 1.0; // Default size
                            targetRotX = 0; targetRotY = 0; targetRotZ = 0; // Default position
                        } else {
                            // Scale relative to baseline
                            const relativeScale = dist / baselineDist;
                            targetScale = Math.max(0.3, Math.min(relativeScale * 1.2, 3.5));
                        }
                    }
                } 
                else if (handsArr.length === 1) {
                    // --- SHAPE CHANGE MODE ---
                    setActiveIcon("idle");
                    baselineDist = null; // Reset baseline when one hand is lost
                    const hand = handsArr[0];
                    
                    if (isPalm(hand)) {
                        if (palmHoldStart === 0) palmHoldStart = Date.now();
                        if ((Date.now() - palmHoldStart) / 1000 > 1.5) {
                            scene.remove(activeMeshGroup);
                            currentShapeIndex = (currentShapeIndex + 1) % geometries.length;
                            activeMeshGroup = new THREE.Group();
                            activeMeshGroup.add(new THREE.Mesh(geometries[currentShapeIndex], holoMatCore));
                            activeMeshGroup.add(new THREE.Mesh(geometries[currentShapeIndex], holoMatWire));
                            activeMeshGroup.add(particles);
                            scene.add(activeMeshGroup);
                            palmHoldStart = 0; 
                        }
                    } else {
                        palmHoldStart = 0;
                    }
                }
            } else {
                palmHoldStart = 0;
                baselineDist = null;
                setActiveIcon("idle");
            }
        }

        // --- Animation Loop (Smoothing Engine) ---
        function animate() {
            requestAnimationFrame(animate);
            const smoothFactor = 0.2; // Snappy but smooth
            
            if (activeMeshGroup) {
                activeMeshGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), smoothFactor);
                activeMeshGroup.rotation.x += (targetRotX - activeMeshGroup.rotation.x) * smoothFactor;
                activeMeshGroup.rotation.y += (targetRotY - activeMeshGroup.rotation.y) * smoothFactor;
                activeMeshGroup.rotation.z += (targetRotZ - activeMeshGroup.rotation.z) * smoothFactor;

                // Animate particles
                particles.rotation.y += 0.002;
                particles.rotation.x += 0.001;
            }
            
            renderer.render(scene, camera);
        }
        animate();

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        initHands();
    </script>
</body>
</html>
