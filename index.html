<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Hand Manipulator</title>
    <style>
        body { margin: 0; background: #050505; overflow: hidden; font-family: sans-serif; color: white; }
        /* Video is hidden but still runs for tracking */
        #video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; z-index: -1; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #ui-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px;
            text-align: center; z-index: 10; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }
        #status { font-size: 14px; font-weight: bold; color: #4a9eff; }
        #gesture { font-size: 12px; color: #aaa; margin-top: 5px; }

        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; color: white; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #333; border-top: 4px solid #4a9eff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div>Initializing Camera & Tracking...</div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>

    <div id="ui-overlay">
        <div id="status">SHOW HAND TO START</div>
        <div id="gesture">PALM: CHANGE SHAPE | PINCH: ROTATE & SCALE</div>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

    <!-- Three.js -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const video = document.getElementById('video');
        const threeCanvas = document.getElementById('three-canvas');
        const loader = document.getElementById('loader');
        const statusDiv = document.getElementById('status');
        const gestureDiv = document.getElementById('gesture');

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 2, 3);
        scene.add(dirLight);

        // --- 3D Primitives ---
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0xff4a6b, roughness: 0.4, metalness: 0.3 }),
            new THREE.MeshStandardMaterial({ color: 0x4a9eff, roughness: 0.4, metalness: 0.3 }),
            new THREE.MeshStandardMaterial({ color: 0xffdd00, roughness: 0.4, metalness: 0.3 }),
            new THREE.MeshStandardMaterial({ color: 0x00ffaa, roughness: 0.4, metalness: 0.3 })
        ];
        const geometries = [
            new THREE.BoxGeometry(1.5, 1.5, 1.5),
            new THREE.ConeGeometry(1, 2, 32),
            new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.TorusGeometry(1, 0.4, 16, 100)
        ];
        
        let activeMesh = new THREE.Mesh(geometries[0], materials[0]);
        activeMesh.position.set(2, 0, 0); // Place to the side so hand skeleton is visible
        scene.add(activeMesh);

        // --- 3D Hand Skeleton Markers ---
        const handGroup = new THREE.Group();
        scene.add(handGroup);

        const jointGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const jointMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const joints = [];
        for(let i=0; i<21; i++) {
            joints.push(new THREE.Mesh(jointGeo, jointMat));
            handGroup.add(joints[i]);
        }

        // 3D Lines for skeleton
        const handConnections = [
            [0,1],[1,2],[2,3],[3,4], // thumb
            [0,5],[5,6],[6,7],[7,8], // index
            [5,9],[9,10],[10,11],[11,12], // middle
            [9,13],[13,14],[14,15],[15,16], // ring
            [13,17],[17,18],[18,19],[19,20], // pinky
            [0,17] // palm base
        ];
        const linePositions = new Float32Array(handConnections.length * 2 * 3);
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 });
        const handLines = new THREE.LineSegments(lineGeometry, lineMaterial);
        handGroup.add(handLines);

        // --- Hand Tracking Logic ---
        let hands;
        let palmHoldStart = 0;
        let currentShapeIndex = 0;

        // MediaPipe to 3D Space Mapping
        function mapLandmark(lm) {
            // Flip X for mirror effect, scale up, and offset to center
            const x = (0.5 - lm.x) * 6;
            const y = (0.5 - lm.y) * 6;
            const z = -lm.z * 6;
            return new THREE.Vector3(x, y, z);
        }

        function initHands() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.5
            });
            hands.onResults(onResults);
            startCamera();
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                await video.play();
                loader.style.display = 'none';
                processFrame();
            } catch (err) {
                alert("Camera access denied or failed.");
            }
        }

        async function processFrame() {
            if (video.readyState >= 2) {
                await hands.send({ image: video });
            }
            requestAnimationFrame(processFrame);
        }

        function onResults(results) {
            let handDetected = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handDetected = true;
                const lm = results.multiHandLandmarks[0];
                
                // Update 3D Joints
                const positions = [];
                for(let i=0; i<21; i++) {
                    const pos = mapLandmark(lm[i]);
                    joints[i].position.copy(pos);
                    positions.push(pos);
                }

                // Update 3D Lines
                let idx = 0;
                for(let i=0; i<handConnections.length; i++) {
                    const [a, b] = handConnections[i];
                    linePositions[idx++] = positions[a].x; linePositions[idx++] = positions[a].y; linePositions[idx++] = positions[a].z;
                    linePositions[idx++] = positions[b].x; linePositions[idx++] = positions[b].y; linePositions[idx++] = positions[b].z;
                }
                handLines.geometry.attributes.position.needsUpdate = true;

                // --- Logic ---
                const thumbTip = lm[4];
                const indexTip = lm[8];
                const indexMcp = lm[5];
                const pinkyMcp = lm[17];
                const wrist = lm[0];
                const middleMcp = lm[9];

                const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y, thumbTip.z - indexTip.z);
                const isPinching = pinchDist < 0.05;

                const isPalm = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y && lm[20].y < lm[18].y;

                if (isPinching) {
                    palmHoldStart = 0; // Cancel palm hold
                    statusDiv.innerText = "STATUS: PINCHING";
                    gestureDiv.innerText = "ROTATING & SCALING";

                    // 1. Rotation: Map palm angle to mesh Y rotation
                    const angle = Math.atan2(indexMcp.y - pinkyMcp.y, indexMcp.x - pinkyMcp.x);
                    activeMesh.rotation.y = -angle * 2.5; 

                    // 2. Scale: Map hand size (depth proxy) to mesh scale
                    const handSize = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y, middleMcp.z - wrist.z);
                    const targetScale = handSize * 15;
                    activeMesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);

                } else if (isPalm) {
                    statusDiv.innerText = "STATUS: OPEN PALM";
                    gestureDiv.innerText = "HOLD TO CHANGE SHAPE...";

                    if (palmHoldStart === 0) palmHoldStart = Date.now();
                    const holdTime = (Date.now() - palmHoldStart) / 1000;

                    if (holdTime > 1.5) {
                        // Cycle shape
                        scene.remove(activeMesh);
                        currentShapeIndex = (currentShapeIndex + 1) % geometries.length;
                        activeMesh = new THREE.Mesh(geometries[currentShapeIndex], materials[currentShapeIndex]);
                        activeMesh.position.set(2, 0, 0);
                        activeMesh.scale.set(1, 1, 1);
                        activeMesh.rotation.set(0, 0, 0);
                        scene.add(activeMesh);
                        palmHoldStart = 0; 
                        statusDiv.innerText = "STATUS: SHAPE CHANGED!";
                    }
                } else {
                    palmHoldStart = 0;
                    statusDiv.innerText = "STATUS: TRACKING";
                    gestureDiv.innerText = "PALM: SHAPE | PINCH: ROTATE/SCALE";
                }
            } 

            // Show/Hide Hand Skeleton
            handGroup.visible = handDetected;

            if (!handDetected) {
                palmHoldStart = 0;
                statusDiv.innerText = "STATUS: NO HAND";
                gestureDiv.innerText = "SHOW HAND TO CAMERA";
            }
        }

        // --- Resize & Animation Loop ---
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        function animate() {
            requestAnimationFrame(animate);
            // STRICT RULE: No idle animation. Model remains completely static unless manipulated.
            renderer.render(scene, camera);
        }
        animate();

        // Start everything
        initHands();
    </script>
</body>
</html>
