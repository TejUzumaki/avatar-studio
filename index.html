<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Dual-Hand Manipulator</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 0; }
        #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        #ui-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 30px;
            text-align: center; z-index: 10; border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
        }
        #status { font-size: 14px; font-weight: bold; color: #4a9eff; }
        #gesture { font-size: 12px; color: #aaa; margin-top: 5px; }

        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; color: white; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #333; border-top: 4px solid #4a9eff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div>Initializing Precision Tracking...</div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <div id="ui-overlay">
        <div id="status">SHOW HANDS TO START</div>
        <div id="gesture">2 HANDS: SCALE | FIST+HAND: ROTATE</div>
    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>

    <!-- Three.js -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const threeCanvas = document.getElementById('three-canvas');
        const loader = document.getElementById('loader');
        const statusDiv = document.getElementById('status');
        const gestureDiv = document.getElementById('gesture');

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 2, 3);
        scene.add(dirLight);

        // Primitives
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0xff4a6b, roughness: 0.3, metalness: 0.5 }),
            new THREE.MeshStandardMaterial({ color: 0x4a9eff, roughness: 0.3, metalness: 0.5 }),
            new THREE.MeshStandardMaterial({ color: 0xffdd00, roughness: 0.3, metalness: 0.5 }),
            new THREE.MeshStandardMaterial({ color: 0x00ffaa, roughness: 0.3, metalness: 0.5 })
        ];
        const geometries = [
            new THREE.BoxGeometry(1.5, 1.5, 1.5),
            new THREE.ConeGeometry(1, 2, 32),
            new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.TorusGeometry(1, 0.4, 16, 100)
        ];
        
        let activeMesh = new THREE.Mesh(geometries[0], materials[0]);
        scene.add(activeMesh);

        // --- Smoothing State Variables ---
        let targetScale = 1.0;
        let targetRotX = 0.0;
        let targetRotY = 0.0;
        let targetRotZ = 0.0;
        let palmHoldStart = 0;
        let currentShapeIndex = 0;

        // --- Hand Tracking Logic ---
        let hands;
        function initHands() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
            });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1, // Higher complexity for precision
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.6
            });
            hands.onResults(onResults);

            const cameraUtil = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); },
                width: 1280,
                height: 720
            });
            cameraUtil.start().then(() => { loader.style.display = 'none'; });
        }

        // Helper: Gesture Detection
        function isFist(lm) {
            // Check if fingers are curled towards palm
            return lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
        }
        function isPalm(lm) {
            return lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y && lm[20].y < lm[18].y;
        }

        function onResults(results) {
            // 1. Draw MediaPipe Native Overlay
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
            overlayCtx.save();
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            // Mirror the drawing context to match the mirrored video
            overlayCtx.translate(window.innerWidth, 0);
            overlayCtx.scale(-1, 1);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
                    drawLandmarks(overlayCtx, landmarks, { color: '#FF0000', lineWidth: 2, radius: 4 });
                }
            }
            overlayCtx.restore();

            // 2. 3D Manipulation Logic
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const handsArr = results.multiHandLandmarks;
                
                // --- Scenario 1: Two Hands Visible (Scaling) ---
                if (handsArr.length === 2) {
                    palmHoldStart = 0; // Cancel shape change
                    const h1 = handsArr[0];
                    const h2 = handsArr[1];

                    const h1Fist = isFist(h1);
                    const h2Fist = isFist(h2);

                    if (h1Fist || h2Fist) {
                        // --- Scenario 2: One Fist (Lock Scale, Other Hand Rotates) ---
                        statusDiv.innerText = "STATUS: SCALE LOCKED";
                        gestureDiv.innerText = "FIST DETECTED. ROTATING WITH OTHER HAND.";
                        
                        const rotHand = h1Fist ? h2 : h1;
                        const isRotHandPalm = isPalm(rotHand);
                        
                        // Only rotate if the rotating hand is open (not a fist)
                        if (!isFist(rotHand)) {
                            // Horizontal movement -> Y axis rotation
                            targetRotY = (rotHand[0].x - 0.5) * Math.PI * 3;
                            // Vertical movement -> X axis rotation
                            targetRotX = (rotHand[0].y - 0.5) * Math.PI * 3;
                            // Hand tilt (roll) -> Z axis rotation
                            const wrist = rotHand[0];
                            const pinkyMcp = rotHand[17];
                            targetRotZ = Math.atan2(pinkyMcp.y - wrist.y, pinkyMcp.x - wrist.x) - Math.PI/2;
                        }
                    } else {
                        // --- Scenario 3: Both Open (Parallel Scaling) ---
                        statusDiv.innerText = "STATUS: SCALING";
                        gestureDiv.innerText = "MOVE HANDS CLOSER/FURTHER TO RESIZE";

                        const wrist1 = h1[0];
                        const wrist2 = h2[0];
                        // 3D distance between hands (normalized)
                        const dist = Math.hypot(wrist1.x - wrist2.x, wrist1.y - wrist2.y, wrist1.z - wrist2.z);
                        
                        // Map distance to scale (closer = 0.5, further = up to 3.0)
                        targetScale = Math.max(0.3, Math.min(dist * 4.0, 3.5));
                    }
                } 
                
                // --- Scenario 4: One Hand Visible (Shape Change) ---
                else if (handsArr.length === 1) {
                    const hand = handsArr[0];
                    if (isPalm(hand)) {
                        statusDiv.innerText = "STATUS: OPEN PALM";
                        gestureDiv.innerText = "HOLD TO CHANGE SHAPE...";

                        if (palmHoldStart === 0) palmHoldStart = Date.now();
                        const holdTime = (Date.now() - palmHoldStart) / 1000;

                        if (holdTime > 1.5) {
                            scene.remove(activeMesh);
                            currentShapeIndex = (currentShapeIndex + 1) % geometries.length;
                            activeMesh = new THREE.Mesh(geometries[currentShapeIndex], materials[currentShapeIndex]);
                            scene.add(activeMesh);
                            palmHoldStart = 0; 
                            statusDiv.innerText = "STATUS: SHAPE CHANGED!";
                        }
                    } else {
                        palmHoldStart = 0;
                        statusDiv.innerText = "STATUS: 1 HAND TRACKING";
                        gestureDiv.innerText = "SHOW 2 HANDS TO SCALE, OR FIST TO ROTATE";
                    }
                }
            } else {
                palmHoldStart = 0;
                statusDiv.innerText = "STATUS: NO HANDS";
                gestureDiv.innerText = "SHOW HANDS TO CAMERA";
            }
        }

        // --- Animation Loop (Smoothing Engine) ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Deterministic Exponential Smoothing
            const smoothFactor = 0.15;
            activeMesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), smoothFactor);
            
            // Lerp rotation for buttery smooth transition
            activeMesh.rotation.x += (targetRotX - activeMesh.rotation.x) * smoothFactor;
            activeMesh.rotation.y += (targetRotY - activeMesh.rotation.y) * smoothFactor;
            activeMesh.rotation.z += (targetRotZ - activeMesh.rotation.z) * smoothFactor;

            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        // Start
        initHands();
    </script>
</body>
</html>
