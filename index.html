<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hologram Interface</title>
    <style>
        body { margin: 0; background: #05050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        #video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1; }
        #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; transform: scaleX(-1); }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        .clip-corner { clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }

        #top-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-start; gap: 15px; z-index: 10; max-width: 95%; }
        #catalog-bar { display: flex; gap: 10px; overflow-x: auto; padding: 10px; background: rgba(15, 15, 25, 0.6); border: 1px solid rgba(255, 145, 0, 0.4); backdrop-filter: blur(8px); max-height: 40px; }
        .catalog-btn { background: transparent; border: 1px solid rgba(255, 145, 0, 0.3); color: #ff9100; padding: 8px 12px; font-size: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; flex: 1; white-space: nowrap; }
        .catalog-btn.active { background: rgba(255, 145, 0, 0.2); border-color: #ff9100; box-shadow: 0 0 10px rgba(255, 145, 0, 0.3); }

        #import-container { display: flex; flex-direction: column; gap: 5px; }
        #import-btn { background: rgba(15, 15, 25, 0.7); border: 1px solid #ff9100; color: #ff9100; padding: 0 15px; font-size: 12px; font-weight: bold; cursor: pointer; backdrop-filter: blur(8px); box-shadow: 0 0 10px rgba(255, 145, 0, 0.3); display: flex; align-items: center; justify-content: center; height: 40px; }
        #file-input { display: none; }
        #import-list { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; max-height: 150px; overflow-y: auto; width: 120px; }
        .import-item { background: rgba(15, 15, 25, 0.7); border: 1px solid rgba(0, 255, 255, 0.3); color: #00ffff; padding: 6px 10px; font-size: 10px; cursor: pointer; text-align: left; transition: 0.2s; width: 100%; box-sizing: border-box; }
        .import-item:hover { background: rgba(0, 255, 255, 0.1); border-color: #00ffff; }
        .import-item.active { background: rgba(0, 255, 255, 0.2); border-color: #00ffff; }

        #ui-dock { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 160px; height: 50px; background: rgba(15, 15, 25, 0.7); border: 1px solid rgba(255, 145, 0, 0.4); backdrop-filter: blur(8px); z-index: 10; display: flex; justify-content: center; align-items: center; }
        .icon { width: 22px; height: 22px; fill: none; stroke: #ff9100; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.3; transition: opacity 0.3s; }
        .icon.active { opacity: 1; filter: drop-shadow(0 0 5px #ff9100); }

        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #05050a; z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 20px; }
        .spinner { border: 2px solid rgba(255, 145, 0, 0.2); border-top: 2px solid #ff9100; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 50; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        #modal-box { background: rgba(15, 15, 25, 0.9); border: 1px solid #00ffff; padding: 30px; text-align: center; max-width: 320px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); }
        #modal-text { color: #00ffff; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn { background: transparent; border: 1px solid #ff9100; color: #ff9100; padding: 10px 20px; font-weight: bold; cursor: pointer; margin: 0 5px; transition: 0.2s; }
        .modal-btn:hover { background: rgba(255, 145, 0, 0.2); }

        #anim-debug { position: absolute; bottom: 20px; left: 20px; width: 150px; max-height: 250px; overflow-y: auto; background: rgba(15, 15, 25, 0.8); border: 1px solid rgba(0, 255, 255, 0.4); padding: 10px; z-index: 10; display: none; }
        #anim-debug h3 { margin: 0 0 10px 0; font-size: 10px; color: #00ffff; text-align: center; border-bottom: 1px solid rgba(0,255,255,0.2); padding-bottom: 5px; }
        .anim-btn { display: block; width: 100%; box-sizing: border-box; text-align: left; background: transparent; border: 1px solid rgba(0, 255, 255, 0.2); color: #00ffff; padding: 5px 8px; font-size: 9px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .anim-btn:hover { background: rgba(0, 255, 255, 0.1); }
        .anim-btn.active { background: rgba(0, 255, 255, 0.3); border-color: #00ffff; }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>

    <div id="modal-overlay">
        <div id="modal-box" class="clip-corner">
            <div id="modal-text">Message</div>
            <div id="modal-buttons"></div>
        </div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <div id="top-bar">
        <div id="catalog-bar" class="clip-corner">
            <button class="catalog-btn active" onclick="selectShape(0)">CUBE</button>
            <button class="catalog-btn" onclick="selectShape(1)">CONE</button>
            <button class="catalog-btn" onclick="selectShape(2)">SPHERE</button>
            <button class="catalog-btn" onclick="selectShape(3)">TORUS</button>
            <button class="catalog-btn" onclick="selectShape(4)">KNOT</button>
            <button class="catalog-btn" onclick="selectShape(5)">DODEC</button>
            <button class="catalog-btn" onclick="selectShape(6)">ICOSA</button>
            <button class="catalog-btn" onclick="selectShape(7)">CYLIN</button>
            <button class="catalog-btn" onclick="selectShape(8)">TETRA</button>
        </div>
        <div id="import-container">
            <input type="file" id="file-input" accept=".glb,.gltf">
            <button id="import-btn" class="clip-corner" onclick="document.getElementById('file-input').click()">IMPORT</button>
            <div id="import-list"></div>
        </div>
    </div>

    <div id="anim-debug" class="clip-corner">
        <h3>ANIMATIONS</h3>
        <div id="anim-list"></div>
    </div>

    <div id="ui-dock" class="clip-corner">
        <svg id="icon-idle" class="icon active" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2  0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
        <svg id="icon-scale" class="icon" viewBox="0 0 24 24" style="margin-left: 40px;"><path d="M21 3L9 15"></path><path d="M12 3h9v9"></path><path d="M3 21l12-12"></path><path d="M12 21H3v-9"></path></svg>
        <svg id="icon-rotate" class="icon" viewBox="0 0 24 24" style="margin-left: 40px;"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const threeCanvas = document.getElementById('three-canvas');
        const loader = document.getElementById('loader');
        const animDebug = document.getElementById('anim-debug');
        const animList = document.getElementById('anim-list');

        const icons = { idle: document.getElementById('icon-idle'), scale: document.getElementById('icon-scale'), rotate: document.getElementById('icon-rotate') };
        function setActiveIcon(name) {
            for (const key in icons) icons[key].classList.remove('active');
            if (icons[name]) icons[name].classList.add('active');
        }

        // --- Custom Modal Logic ---
        const modalOverlay = document.getElementById('modal-overlay');
        const modalText = document.getElementById('modal-text');
        const modalButtons = document.getElementById('modal-buttons');

        function showModal(text, buttons) {
            modalText.innerText = text;
            modalButtons.innerHTML = '';
            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.innerText = btn.text;
                b.className = `modal-btn clip-corner ${btn.color || ''}`;
                b.onclick = () => { modalOverlay.style.display = 'none'; if(btn.onClick) btn.onClick(); };
                modalButtons.appendChild(b);
            });
            modalOverlay.style.display = 'flex';
        }

        // --- IndexedDB Smart Caching ---
        let db;
        let cachedModelNames = [];
        let currentCacheIndex = 0;
        const dbRequest = indexedDB.open('HoloModelDB', 1);
        dbRequest.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('models')) db.createObjectStore('models', { keyPath: 'name' });
        };
        dbRequest.onsuccess = (e) => { db = e.target.result; renderImportList(); };

        function saveModelToDB(name, blob) {
            if (!db) return;
            try {
                const tx = db.transaction('models', 'readwrite');
                tx.objectStore('models').put({ name, blob });
                tx.onerror = () => showModal("Model is too large to cache permanently in browser storage.", [{text: "OK"}]);
                tx.oncomplete = () => renderImportList();
            } catch (err) { console.error("Cache error:", err); }
        }

        function loadModelFromDB(name) {
            if (!db) return;
            const tx = db.transaction('models', 'readonly');
            const req = tx.objectStore('models').get(name);
            req.onsuccess = (e) => {
                if (e.target.result) {
                    const url = URL.createObjectURL(e.target.result.blob);
                    loadCustomGLTF(url, name);
                } else {
                    showModal("Model not found in cache. Please re-import it.", [{text: "OK"}]);
                }
            };
        }

        function renderImportList() {
            if (!db) return;
            const tx = db.transaction('models', 'readonly');
            const req = tx.objectStore('models').getAllKeys();
            req.onsuccess = (e) => {
                cachedModelNames = e.target.result;
                const list = document.getElementById('import-list');
                list.innerHTML = '';
                cachedModelNames.forEach(name => {
                    const btn = document.createElement('button');
                    btn.innerText = name.length > 15 ? name.substring(0, 12) + '...' : name;
                    btn.className = 'import-item clip-corner';
                    btn.onclick = () => loadModelFromDB(name);
                    list.appendChild(btn);
                });
            };
        }

        // --- Three.js Iron Man Environment ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);
        scene.fog = new THREE.Fog(0x05050a, 6, 25);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4.5);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 

        scene.add(new THREE.AmbientLight(0x00ffff, 0.2));
        const spotLight = new THREE.SpotLight(0x00ffff, 2.5);
        spotLight.position.set(0, 8, 0);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.5;
        scene.add(spotLight);
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(2, 2, 3);
        scene.add(fillLight);

        const grid = new THREE.GridHelper(40, 80, 0x00ffff, 0x002233);
        grid.material.transparent = true;
        grid.material.opacity = 0.4;
        scene.add(grid);

        const ringGeo = new THREE.RingGeometry(1.2, 1.4, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const projectionRing = new THREE.Mesh(ringGeo, ringMat);
        projectionRing.rotation.x = -Math.PI / 2;
        projectionRing.position.y = 0.01;
        scene.add(projectionRing);

        const holoPivot = new THREE.Group();
        holoPivot.position.y = 1.0;
        scene.add(holoPivot);

        // --- FIXED HOLOGRAPHIC SHADER (Proper Skinning Support) ---
        const holoMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color('#00ffff') },
                uAlpha: { value: 0.6 },
                uFresnelPower: { value: 3.0 },
                uFresnelIntensity: { value: 1.0 },
                uScanlineFrequency: { value: 50 },
                uScanlineSpeed: { value: 10 },
                uGlitchIntensity: { value: 0.08 },
                uGlitchFrequency: { value: 0 },
                uRippleFrequency: { value: 0 },
                uRippleSpeed: { value: 0 },
                uRippleHeight: { value: 0 }
            },
            vertexShader: `
                #include <common>
                #include <skinning_pars_vertex>

                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying float vRipple;

                uniform float uTime;
                uniform float uGlitchIntensity;
                uniform float uGlitchFrequency;
                uniform float uRippleFrequency;
                uniform float uRippleSpeed;
                uniform float uRippleHeight;

                void main() {
                    #include <skinbase_vertex>
                    
                    vec3 transformed = position;
                    #include <skinning_vertex>
                    
                    // Custom displacement
                    float ripple = sin(transformed.y * uRippleFrequency - uTime * uRippleSpeed);
                    vRipple = ripple;
                    transformed += normal * ripple * uRippleHeight;

                    float glitchTime = floor(uTime * uGlitchFrequency);
                    float noiseVal = fract(sin(dot(vec2(glitchTime, transformed.y * 0.1), vec2(12.9898,78.233))) * 43758.5453123);
                    if (noiseVal > 0.75) {
                        float r1 = fract(sin(dot(vec2(transformed.y, uTime), vec2(12.9898,78.233))) * 43758.5453123) - 0.5;
                        float r2 = fract(sin(dot(vec2(transformed.x, uTime), vec2(12.9898,78.233))) * 43758.5453123) - 0.5;
                        transformed.x += r1 * uGlitchIntensity;
                        transformed.z += r2 * uGlitchIntensity;
                    }

                    vec4 mvPosition = vec4( transformed, 1.0 );
                    #ifdef USE_INSTANCING
                        mvPosition = instanceMatrix * mvPosition;
                    #endif
                    mvPosition = modelViewMatrix * mvPosition;
                    gl_Position = projectionMatrix * mvPosition;
                    
                    vWorldPosition = (modelMatrix * vec4(transformed, 1.0)).xyz;
                    vNormal = normalize(normalMatrix * normal);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uColor;
                uniform float uAlpha;
                uniform float uFresnelPower;
                uniform float uFresnelIntensity;
                uniform float uScanlineFrequency;
                uniform float uScanlineSpeed;

                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying float vRipple;

                void main() {
                    vec3 viewDir = normalize(cameraPosition - vWorldPosition);
                    float fresnel = pow(1.0 - max(dot(viewDir, normalize(vNormal)), 0.0), uFresnelPower) * uFresnelIntensity;
                    
                    float scanline = sin(vWorldPosition.y * uScanlineFrequency - uTime * uScanlineSpeed) * 0.5 + 0.5;
                    scanline = pow(scanline, 1.5);

                    // Added baseAlpha to ensure the model is never completely invisible
                    float baseAlpha = 0.2;
                    float holoAlpha = baseAlpha + (fresnel + scanline * 0.35 + vRipple * 0.1) * uAlpha;
                    
                    vec3 finalColor = uColor + vec3(fresnel * 0.5);
                    gl_FragColor = vec4(finalColor, clamp(holoAlpha, 0.0, 1.0));
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            skinning: true // THIS IS REQUIRED FOR RIGGED ANIMATIONS!
        });

        const geometries = [
            new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.ConeGeometry(1, 2, 32), new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.TorusGeometry(1, 0.4, 16, 100), new THREE.TorusKnotGeometry(0.8, 0.25, 100, 16),
            new THREE.DodecahedronGeometry(1.2), new THREE.IcosahedronGeometry(1.2), new THREE.CylinderGeometry(0.8, 0.8, 2, 32),
            new THREE.TetrahedronGeometry(1.5)
        ];

        let activeMesh = new THREE.Mesh(geometries[0], holoMaterial);
        holoPivot.add(activeMesh); 

        // --- Animation State ---
        let mixer = null;
        let animations = [];
        let currentAnimIndex = 0;
        let currentAction = null;
        let isCustomModelLoaded = false;
        let lastAnimSwitch = 0;
        let lastHandSeenTime = Date.now();
        let palmHoldStart = 0;

        const gltfLoader = new GLTFLoader();
        document.getElementById('file-input').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            saveModelToDB(file.name, file);
            const url = URL.createObjectURL(file);
            loadCustomGLTF(url, file.name);
        });

        function clearAnimDebug() {
            animList.innerHTML = '';
            animDebug.style.display = 'none';
        }

        function loadCustomGLTF(url, name) {
            gltfLoader.load(url, (gltf) => {
                while(holoPivot.children.length > 0){ holoPivot.remove(holoPivot.children[0]); }
                activeMesh = gltf.scene;
                
                activeMesh.traverse((child) => { if(child.isMesh) child.material = holoMaterial; });
                
                const box = new THREE.Box3().setFromObject(activeMesh);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                const maxDim = Math.max(0.1, size.x, size.y, size.z);
                const baseScale = 1.5 / maxDim;
                
                activeMesh.scale.setScalar(baseScale);
                activeMesh.position.x = -center.x * baseScale;
                activeMesh.position.y = -center.y * baseScale;
                activeMesh.position.z = -center.z * baseScale;
                
                holoPivot.add(activeMesh);
                
                targetScale = 1.0;
                targetRotX = 0; targetRotY = 0; targetRotZ = 0;
                holoPivot.scale.set(1, 1, 1);
                holoPivot.rotation.set(0,0,0);

                if (mixer) mixer.stopAllAction();
                
                // FILTER T-POSE OUT OF ANIMATIONS
                animations = gltf.animations.filter(clip => {
                    const cName = clip.name.toLowerCase();
                    return !cName.includes('tpose') && !cName.includes('t-pose') && !cName.includes('bind') && !cName.includes('rest');
                });
                
                clearAnimDebug();

                if (animations.length > 0) {
                    mixer = new THREE.AnimationMixer(activeMesh);
                    isCustomModelLoaded = true;
                    
                    animDebug.style.display = 'block';
                    animations.forEach((clip, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'anim-btn';
                        btn.innerText = clip.name || `Anim ${index+1}`;
                        btn.onclick = () => playAnimationByIndex(index);
                        animList.appendChild(btn);
                    });
                    
                    playAnimationByIndex(0);
                } else {
                    mixer = null;
                    isCustomModelLoaded = true;
                }

                document.querySelectorAll('.catalog-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.import-item').forEach(btn => {
                    btn.classList.toggle('active', btn.innerText === name || name.includes(btn.innerText));
                });
            });
        }

        function playAnimationByIndex(index) {
            if (!mixer || animations.length === 0) return;
            
            if (currentAction) currentAction.fadeOut(0.5);

            currentAnimIndex = index;
            currentAction = mixer.clipAction(animations[currentAnimIndex]);
            currentAction.reset();
            currentAction.setEffectiveTimeScale(1);
            currentAction.setEffectiveWeight(1);
            currentAction.fadeIn(0.5).play();

            document.querySelectorAll('.anim-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentAnimIndex);
            });
        }

        function playNextAnimation() {
            if (animations.length === 0) return;
            let next = (currentAnimIndex + 1) % animations.length;
            playAnimationByIndex(next);
        }

        let targetScale = 1.0;
        let currentShapeIndex = 0;
        let targetRotX = 0.0, targetRotY = 0.0, targetRotZ = 0.0;

        let scaleModeActive = false, scaleBaselineDist = 0, scaleBaselineModelScale = 1.0;
        let rotModeActive = false, rotBaselineHandX = 0, rotBaselineHandY = 0, rotBaselineHandAngle = 0;
        let rotBaselineModelX = 0, rotBaselineModelY = 0, rotBaselineModelZ = 0;

        window.selectShape = function(index) {
            if (index === currentShapeIndex && !isCustomModelLoaded) return;
            while(holoPivot.children.length > 0){ holoPivot.remove(holoPivot.children[0]); }
            currentShapeIndex = index;
            activeMesh = new THREE.Mesh(geometries[index], holoMaterial);
            holoPivot.add(activeMesh);
            
            if (mixer) mixer.stopAllAction();
            mixer = null; animations = []; isCustomModelLoaded = false; currentAction = null;
            clearAnimDebug();
            
            targetScale = 1.0; targetRotX = 0; targetRotY = 0; targetRotZ = 0;
            scaleModeActive = false; rotModeActive = false;
            
            document.querySelectorAll('.catalog-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            document.querySelectorAll('.import-item').forEach(btn => btn.classList.remove('active'));
        }

        // --- Hand Tracking ---
        let hands;
        function initHands() {
            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
            hands.onResults(onResults);
            startRawCamera();
        }

        async function startRawCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } });
                video.srcObject = stream;
                await video.play();
                loader.style.display = 'none';
                processFrame();
            } catch (err) { console.error("Camera error:", err); }
        }

        async function processFrame() {
            if (video.readyState >= 2) await hands.send({ image: video });
            requestAnimationFrame(processFrame);
        }

        function isFist(lm) { return lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y; }
        function isPalm(lm) { return lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y && lm[20].y < lm[18].y; }
        function isPeace(lm) { return lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y; }

        function onResults(results) {
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, { color: 'rgba(255,255,255,0.9)', lineWidth: 3 });
                    drawLandmarks(overlayCtx, landmarks, { color: 'rgba(255,0,0,1)', fillColor: 'rgba(255,0,0,1)', lineWidth: 1, radius: 4 });
                }
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                lastHandSeenTime = Date.now();
                const handsArr = results.multiHandLandmarks;
                
                if (handsArr.length === 2) {
                    palmHoldStart = 0; // Cancel palm hold
                    const h1 = handsArr[0], h2 = handsArr[1];
                    const h1Fist = isFist(h1), h2Fist = isFist(h2);

                    if (h1Fist || h2Fist) {
                        setActiveIcon("rotate");
                        scaleModeActive = false; 
                        const rotHand = h1Fist ? h2 : h1;
                        
                        if (!isFist(rotHand)) {
                            const handX = rotHand[0].x, handY = rotHand[0].y;
                            const wrist = rotHand[0], pinkyMcp = rotHand[17];
                            const handAngle = Math.atan2(pinkyMcp.y - wrist.y, pinkyMcp.x - wrist.x);

                            if (!rotModeActive) {
                                rotModeActive = true;
                                rotBaselineHandX = handX; rotBaselineHandY = handY; rotBaselineHandAngle = handAngle;
                                rotBaselineModelX = holoPivot.rotation.x; rotBaselineModelY = holoPivot.rotation.y; rotBaselineModelZ = holoPivot.rotation.z;
                            } else {
                                const isHumanoid = isCustomModelLoaded && animations.length > 0;
                                if (isHumanoid) {
                                    targetRotY = rotBaselineModelY - (handX - rotBaselineHandX) * Math.PI * 3;
                                    targetRotX = rotBaselineModelX; 
                                    targetRotZ = rotBaselineModelZ; 
                                } else {
                                    targetRotY = rotBaselineModelY - (handX - rotBaselineHandX) * Math.PI * 3;
                                    targetRotX = rotBaselineModelX - (handY - rotBaselineHandY) * Math.PI * 3; 
                                    targetRotZ = rotBaselineModelZ + (handAngle - rotBaselineHandAngle);
                                }
                            }
                        }
                    } else {
                        setActiveIcon("scale");
                        rotModeActive = false; 
                        const wrist1 = h1[0], wrist2 = h2[0];
                        const dist = Math.hypot(wrist1.x - wrist2.x, wrist1.y - wrist2.y, wrist1.z - wrist2.z);
                        
                        if (!scaleModeActive) {
                            scaleModeActive = true; scaleBaselineDist = dist; scaleBaselineModelScale = holoPivot.scale.x; 
                        } else {
                            const scaleRatio = dist / scaleBaselineDist;
                            targetScale = Math.max(0.2, Math.min(scaleBaselineModelScale * scaleRatio, 4.0));
                        }
                    }
                } else if (handsArr.length === 1) {
                    setActiveIcon("idle");
                    scaleModeActive = false; rotModeActive = false;
                    const hand = handsArr[0];
                    
                    if (isPeace(hand)) {
                        const now = Date.now();
                        if (now - lastAnimSwitch > 1000) { 
                            if (isCustomModelLoaded && animations.length > 0) {
                                playNextAnimation();
                                lastAnimSwitch = now;
                            }
                        }
                    } else if (isPalm(hand)) {
                        // SMART OPEN PALM: Cycle models if cached, else cycle primitives
                        if (palmHoldStart === 0) palmHoldStart = Date.now();
                        if ((Date.now() - palmHoldStart) / 1000 > 1.5) {
                            if (cachedModelNames.length > 0) {
                                currentCacheIndex = (currentCacheIndex + 1) % cachedModelNames.length;
                                loadModelFromDB(cachedModelNames[currentCacheIndex]);
                            } else {
                                selectShape((currentShapeIndex + 1) % geometries.length);
                            }
                            palmHoldStart = 0; 
                        }
                    } else {
                        palmHoldStart = 0;
                    }
                }
            } else {
                palmHoldStart = 0;
                scaleModeActive = false; rotModeActive = false; setActiveIcon("idle");
                
                if (Date.now() - lastHandSeenTime > 10000) {
                    targetRotX = 0; targetRotY = 0; targetRotZ = 0; 
                    targetScale = 1.0;
                }
            }
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.elapsedTime;
            
            holoMaterial.uniforms.uTime.value = elapsed;
            if (mixer) mixer.update(delta);
            
            const smoothFactor = 0.05;
            holoPivot.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), smoothFactor);
            holoPivot.rotation.x += (targetRotX - holoPivot.rotation.x) * smoothFactor;
            holoPivot.rotation.y += (targetRotY - holoPivot.rotation.y) * smoothFactor;
            holoPivot.rotation.z += (targetRotZ - holoPivot.rotation.z) * smoothFactor;

            projectionRing.rotation.z += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        initHands();
    </script>
</body>
</html>
